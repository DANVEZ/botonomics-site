/* 六种语言的自称——写死成各自的语言，不跟着界面语言翻译：
   中文用户找「中文」，Deutsch 用户找「Deutsch」，谁也犯不着先猜。 */
var LANG_NATIVE = {zh:"中文", "zh-TW":"繁體中文", en:"English", de:"Deutsch", it:"Italiano",
  fr:"Français", es:"Español", nl:"Nederlands", "pt-BR":"Português (BR)", ja:"日本語", ko:"한국어", vi:"Tiếng Việt", ru:"Русский"};
/* <html lang> 用的标准 BCP-47 标签，跟界面语言代码不是一回事 */
var HTML_LANG = {"zh":"zh-CN", "zh-TW":"zh-Hant", "pt-BR":"pt-BR"};

function buildLangPanel(){
  var panel = $("#langPanel");
  if (!panel) return;
  panel.innerHTML = LANGS.map(function(l){
    return '<button type="button" class="pop-item" role="option" data-lang="' + l + '"'
         + ' aria-selected="' + (l === state.lang) + '">'
         + '<span class="pop-check" aria-hidden="true">✓</span>'
         + '<span>' + esc(LANG_NATIVE[l]) + '</span></button>';
  }).join("");
  panel.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      setLang(b.dataset.lang);
      closeLangPanel(true);
    });
  });
}
function langPanelOpen(){ var p = $("#langPanel"); return !!p && !p.hidden; }
/* 弹层用 fixed 定位 + JS 给坐标：窄屏 .bar-tools 是 overflow-x:auto 的横滑条，
   absolute 的弹层会被它裁掉；fixed 的不会。坐标按触发按钮的 rect 算，右侧贴边时向左收。 */
function positionLangPanel(){
  var panel = $("#langPanel"), btn = $("#langBtn");
  if (!panel || !btn || panel.hidden) return;
  var r = btn.getBoundingClientRect();
  var w = panel.offsetWidth || 174;
  var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  var top = r.bottom + 6;
  var h = panel.offsetHeight || 0;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  panel.style.left = Math.round(left) + "px";
  panel.style.top = Math.round(top) + "px";
}
function openLangPanel(){
  var panel = $("#langPanel"), btn = $("#langBtn");
  if (!panel || !btn || panel.hidden === false) return;
  syncLangPanel();
  panel.hidden = false;
  positionLangPanel();
  btn.setAttribute("aria-expanded", "true");
}
function closeLangPanel(focusBack){
  var panel = $("#langPanel"), btn = $("#langBtn");
  if (!panel || panel.hidden) return;
  panel.hidden = true;
  if (btn) btn.setAttribute("aria-expanded", "false");
  if (focusBack && btn) btn.focus();
}
function syncLangPanel(){
  var panel = $("#langPanel"), btn = $("#langBtn");
  if (btn){
    var lab = $("#langBtnLabel");
    if (lab) lab.textContent = LANG_NATIVE[state.lang] || state.lang;
    btn.setAttribute("aria-label", t("chrome.langBtn", {name: LANG_NATIVE[state.lang] || state.lang}));
  }
  if (panel){
    panel.setAttribute("aria-label", t("chrome.langLabel"));
    panel.querySelectorAll("button").forEach(function(b){
      b.setAttribute("aria-selected", String(b.dataset.lang === state.lang));
    });
  }
}
/* 点外面 / 按 Esc 关闭；键盘焦点移出弹层也关（Tab 走掉就收） */
function bindLangPanelDismiss(){
  document.addEventListener("click", function(e){
    if (!langPanelOpen()) return;
    var w = $("#langWrap");
    if (w && !w.contains(e.target)) closeLangPanel(false);
  });
  document.addEventListener("keydown", function(e){
    if (!langPanelOpen()) return;
    if (e.key === "Escape"){ e.preventDefault(); closeLangPanel(true); return; }
    if (e.key === "Tab"){
      var w = $("#langWrap");
      if (w && !w.contains(e.target)) closeLangPanel(false);
      return;
    }
    /* ↑↓ 在六个选项间移动焦点：省得按六次 Tab */
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      var items = $$("#langPanel .pop-item");
      var i = items.indexOf(document.activeElement);
      if (i < 0) return;
      e.preventDefault();
      var n = (i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      items[n].focus();
    }
  });
  window.addEventListener("resize", positionLangPanel);
  window.addEventListener("scroll", positionLangPanel, true);
}
function setLang(l){
  if (LANGS.indexOf(l) < 0 || l === state.lang) return;
  state.lang = l;
  document.documentElement.lang = HTML_LANG[l] || l;
  $$("#modeSeg button").forEach(function(b){ b.textContent = t(b.dataset.mode === "clean" ? "chrome.mode.clean"

/* 窄屏口径条收起时，露到「汇率 1 € =」那一格为止 —— 收起高度按实际行高算，
   不写死像素，免得字号/语言一换就把币种那一行切一半。 */
function syncCondCollapse(){
  var cond = $("#cond");
  if (!cond) return;
  var narrow = window.matchMedia && window.matchMedia("(max-width:899px)").matches;
  if (!narrow){ cond.style.maxHeight = ""; return; }
  if (cond.classList.contains("open")){ cond.style.maxHeight = "none"; return; }
  cond.style.maxHeight = "";
  var items = cond.querySelectorAll(".citem");
  if (!items.length) return;
  var last = cond.querySelector(".citem-fx") || items[Math.min(1, items.length - 1)];
  var top = cond.getBoundingClientRect().top;
  cond.style.maxHeight = Math.ceil(last.getBoundingClientRect().bottom - top + 1) + "px";
}
function relayout(){
  placeThumb("#modeSeg", "#modeThumb");
  positionLangPanel();
  syncAutoToggles(); syncCostMode(); syncPresetSeg();
  syncCondCollapse();
  var bar = $(".bar"), nav = $(".nav"), cond = $("#cond");
  document.documentElement.style.setProperty("--chromeH",
    (bar.offsetHeight + nav.offsetHeight + cond.offsetHeight) + "px");
  if (lastResult) drawChart(lastResult);

var pending = false, lastResult = null;
function schedule(immediate){
  if (pending) return;
  if (immediate){ run(); return; }
  pending = true;
  requestAnimationFrame(function(){ pending = false; run(); });
}
function run(){
  resolveAuto();
  var r = compute();
  lastResult = r;
  renderHero(r); renderBench(r); renderKpi(r); renderRuler(r); drawChart(r);
  bind.forEach(function(rec){
    if (rec.p.auto){
      var note = document.getElementById("autoNote-" + rec.p.k);
      if (note) note.textContent = autoOn(rec.p.k)
        ? t("auto.auto") + " → " + fmtNum(state.v[rec.p.k], rec.p.dec, state.lang)
        : t("auto.manualNote");
    }
  });
}
function readUrl(){
  var q = new URLSearchParams(location.search);
  var PREFIX_MAP = {"zh-hant":"zh-TW","zh-hk":"zh-TW","zh-mo":"zh-TW","pt":"pt-BR","pt-pt":"pt-BR","zh-cn":"zh","zh-hans":"zh"};
  var bl = (navigator.language || "en").replace("_","-"), blLow = bl.toLowerCase();
  if (LANGS.indexOf(bl) >= 0) state.lang = bl;
  else if (PREFIX_MAP[blLow]) state.lang = PREFIX_MAP[blLow];
  else { var base = blLow.split("-")[0]; state.lang = LANGS.indexOf(base) >= 0 ? base : "en"; }
  if (q.has("lang") && LANGS.indexOf(q.get("lang")) >= 0) state.lang = q.get("lang");
  if (q.has("mode") && ENGINES[q.get("mode")]) state.mode = q.get("mode");
  if (q.has("country") && COUNTRY_DATA.countries[q.get("country")]) state.country = q.get("country");
  /* 餐饮引擎是官方 $ 口径，默认就用 $；其余场景默认跟国家本币 */
  state.displayCur = (state.mode === "catering") ? "USD"
                   : (COUNTRY_DATA.countries[state.country].currency || "EUR");
  if (q.has("cur") && CUR_ORDER.indexOf(q.get("cur")) >= 0) state.displayCur = q.get("cur");
  /* 主题：URL 优先（方便截图与分享）→ localStorage → 跟随系统 */
  if (q.has("theme") && THEMES.indexOf(q.get("theme")) >= 0) state.theme = q.get("theme");
  else state.theme = themeStored() || "auto";
  if (q.has("combo")) setComboFromQuery(q.get("combo"));
  if (q.has("narrow")) state.combo.narrow = q.get("narrow") === "1";
  if (q.has("upcoming")) state.combo.includeUpcoming = q.get("upcoming") === "1";
  ["area_m2","rooms","tables","floors","shifts","peak_orders"].forEach(function(k){
    if (q.has(k)){
      var x = parseFloat(q.get(k));
      if (isFinite(x)) state.combo.scale[k] = x;
    }
  });
  if (q.has("applied")) state.combo.applied = q.get("applied") === "1";
}
function setComboFromQuery(id){
  var s = findScenario(id);
  state.combo.cat = s.cat; state.combo.scen = s.id;
}
function boot(){
  buildRates();
  /* 先按上次的选择定色，避免首帧闪一下再翻色；readUrl() 之后再 applyTheme() 定稿 */
  document.documentElement.setAttribute("data-theme", themeStored() || "auto");
  /* 跟随系统时，系统换主题要跟着换（并重画曲线） */
  var tm = themeMedia();
  if (tm){
    var onSys = function(){ if (state.theme === "auto"){ applyTheme(); if (lastResult) drawChart(lastResult); } };
    if (tm.addEventListener) tm.addEventListener("change", onSys);
    else if (tm.addListener) tm.addListener(onSys);
  }
  /* 打印 / 存 PDF 一律走浅色：SVG 的颜色是画的时候烘进去的，
     所以进打印前用浅色 token 重画一次，出来再按当前主题画回来。 */
  window.addEventListener("beforeprint", function(){
    printMode = true;
    if (lastResult) drawChart(lastResult);
  });
  window.addEventListener("afterprint", function(){
    printMode = false;
    if (lastResult) drawChart(lastResult);
  });
  state.combo.cat = state.combo.cat || "hotel";
  state.combo.scen = state.combo.scen || "hotel_cross_floor";
  state.combo.pain = state.combo.pain || {};
  state.combo.scale = state.combo.scale || {};
  state.combo.narrow = state.combo.narrow === true;
  state.combo.includeUpcoming = state.combo.includeUpcoming === true;
  readUrl();
  state.v = Object.assign({}, ENGINES[state.mode].defaults);
  resolveAuto();
  buildLangPanel();
  bindLangPanelDismiss();
  setLangInit();
  applyTheme();
  $$("#modeSeg button").forEach(function(b){
    b.addEventListener("click", function(){ setMode(b.dataset.mode); });
  });
  /* 主题按钮：点一下走下一个状态（跟随系统 → 浅色 → 深色 → 跟随系统） */
  $("#themeBtn").addEventListener("click", function(){ setTheme(nextTheme(state.theme)); });
  /* 语言按钮：点开/收起弹层 */
  $("#langBtn").addEventListener("click", function(){
    if (langPanelOpen()) closeLangPanel(false); else openLangPanel();
  });
  /* 窄屏：口径条只露前两行，这个按钮展开其余（宽屏由 CSS 隐藏按钮） */
  $("#btnCond").addEventListener("click", function(){
    var open = $("#cond").classList.toggle("open");
    this.setAttribute("aria-expanded", String(open));
    relayout();
  });
  $("#btnOfficial").addEventListener("click", function(){
    resetAll();
    state.countryAuto = false;
    renderCond();
    schedule(true);
  });
  $("#btnReset").addEventListener("click", function(){ resetAll(); renderCond(); });
  $("#btnPrint").addEventListener("click", function(){ window.print(); });
  renderCond(); buildInputs(); renderComboCards(); renderFoot();
  bindChartHover();
  relayout();
  run();
  /* 页面加载时按序试三个实时源；不阻塞首屏，取到后即时更新换算 */
  fxManualRefresh();
  requestAnimationFrame(function(){
    $$(".enter").forEach(function(el, i){ el.style.setProperty("--d", (i*60) + "ms"); el.classList.add("shown"); });
  });
  setTimeout(function(){ $$("#heroDigits .dg").forEach(function(d){ d.dataset.ready = "1"; }); }, 80);
  var rt = null;
  window.addEventListener("resize", function(){
    clearTimeout(rt);
    rt = setTimeout(relayout, 120);
  });
}
function setLangInit(){
  document.documentElement.lang = HTML_LANG[state.lang] || state.lang;
  $$("#modeSeg button").forEach(function(b){
    b.textContent = t(b.dataset.mode === "clean" ? "chrome.mode.clean"
      : b.dataset.mode === "hotel" ? "chrome.mode.hotel"
      : b.dataset.mode === "catering" ? "chrome.mode.catering" : "chrome.mode.combo");
    b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode));
  });
  $("#brandSub").textContent = t("chrome.scope." + state.mode);
  $("#btnOfficial").textContent = t("chrome.official");
  $("#btnReset").textContent = t("chrome.reset");
  $("#btnPrint").textContent = t("chrome.print");
  $("#btnCondText").textContent = t("cond.toggle");
  syncLangPanel();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

/* ============================================================
   皮肤控制器（skin）
   —— 独立于主题三态与 boot()/readUrl()：只读写 <html data-skin>。
   优先级：URL ?skin= > localStorage["botonomics-skin"] > 默认 keenon。
   切换不重载页面；图表色是 drawChart() 时烘进 SVG 的，换皮肤要重画。
   ============================================================ */
(function(){
  var SKINS = ["keenon", "whitespace", "paper", "keenon"];
  var KEY = "botonomics-skin";
  var cur = "keenon";
  function fromUrl(){
    try {
      var v = new URLSearchParams(location.search).get("skin");
      return SKINS.indexOf(v) >= 0 ? v : null;
    } catch (e) { return null; }
  }
  function fromStore(){
    try {
      var v = window.localStorage.getItem(KEY);
      return SKINS.indexOf(v) >= 0 ? v : null;
    } catch (e) { return null; }   /* 隐私模式下 localStorage 会抛 */
  }
  function tr(k){ return typeof t === "function" ? t(k) : k; }
  function paint(){
    var seg = document.getElementById("skinSeg");
    if (!seg) return;
    var btns = seg.querySelectorAll("button[data-skin]");
    for (var i = 0; i < btns.length; i++){
      var b = btns[i], on = b.getAttribute("data-skin") === cur;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.textContent = tr("skin." + b.getAttribute("data-skin"));
    }
    seg.setAttribute("aria-label", tr("skin.label"));
    if (typeof placeThumb === "function") placeThumb("#skinSeg", "#skinThumb");
  }
  function apply(v, persist){
    if (SKINS.indexOf(v) < 0) return;
    cur = v;
    document.documentElement.setAttribute("data-skin", v);
    if (persist){
      try { window.localStorage.setItem(KEY, v); } catch (e) { /* 存不了就算了 */ }
    }
    paint();
    if (lastResult) drawChart(lastResult);   /* 图表色是烘进去的，换皮肤要重画 */
  }
  /* 首帧就定色，避免先闪一下默认皮肤 */
  cur = fromUrl() || fromStore() || "keenon";
  document.documentElement.setAttribute("data-skin", cur);
  function init(){
    var seg = document.getElementById("skinSeg");
    if (!seg) return;
    paint();
    seg.addEventListener("click", function(e){
      var b = e.target && e.target.closest ? e.target.closest("button[data-skin]") : null;
      if (b) apply(b.getAttribute("data-skin"), true);
    });
    /* 语言切换会改写按钮文案（setLang 改的是 <html lang>） */
    if (window.MutationObserver){
      new MutationObserver(paint).observe(document.documentElement,
        { attributes: true, attributeFilter: ["lang"] });
    }
    window.addEventListener("resize", function(){ placeThumb("#skinSeg", "#skinThumb"); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
