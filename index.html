   纯计算核心（无 DOM 依赖，可被 verify.mjs 整块抽取复算）
   ============================================================ */
/* === PURE-MATH-BEGIN === */

/* ---------------- A. 清洁场景（C30 / C40 / C55） ----------------
   日清洁量   demand = 面积 × 频次                        (㎡/天)
   人工日工时 H      = demand ÷ 人工效率                  (h/天)
   自动人数   P      = ⌈H ÷ 每班工时⌉
   自动台数   N      = ⌈面积 ÷ 单机覆盖面积⌉
   每台账面月成本 = 租金(或 购置价÷折旧月数) + 维护 + 电费
   月净节省(m) = (人数 − 留守当量)×月薪×社保×(1+g)^年 − N×每台账面
   现金回本    cum(0) = −初始投入；cum(m) = cum(m−1) + 现金月净流入
*/
function computeClean(v, mode){
  var g = v.growth / 100, r = v.rate / 100;

  var demand    = v.area * v.freq;
  var workHours = demand / v.lrate;
  var headsAuto = Math.max(1, Math.ceil(workHours / v.hours));
  var nAuto     = Math.max(1, Math.ceil(v.area / v.cover));
  var heads     = v.heads;
  var n         = v.n;

  var accrualPer = (mode === "lease" ? v.rent : v.price / (v.life * 12)) + v.maint + v.power;
  var cashPer    = (mode === "lease" ? v.rent : 0) + v.maint + v.power;

  function humanAt(m){    return heads * v.salary * v.burden * Math.pow(1 + g, Math.floor(m / 12)); }
  function residualAt(m){ return v.residual * v.salary * v.burden * Math.pow(1 + g, Math.floor(m / 12)); }

  var robotAccrual = n * accrualPer;
  var robotCash    = n * cashPer;
  var monthlyNet   = humanAt(0) - residualAt(0) - robotAccrual;

  var I0      = mode === "purchase" ? n * v.price : 0;
  var cf = [], cum = [-I0];
  for (var m = 0; m < HORIZON; m++){
    var c = humanAt(m) - residualAt(m) - robotCash;
    cf.push(c);
    cum.push(cum[m] + c);
  }

  var payback = null;
  if (I0 === 0) payback = null;
  else if (cum[1] >= 0) payback = 0;
  else {
    for (var q = 1; q <= HORIZON; q++){
      if (cum[q] >= 0){
        var span = cum[q] - cum[q-1];
        payback = (q - 1) + (span > 0 ? (-cum[q-1]) / span : 0);
        break;
      }
    }
  }

  var totalNet3 = 0, totalSave3 = 0;
  for (var s = 0; s < HORIZON; s++){ totalNet3 += humanAt(s) - residualAt(s) - robotAccrual; totalSave3 += humanAt(s) - residualAt(s); }
  var base3 = mode === "purchase" ? n * v.price : HORIZON * n * v.rent;
  var roi3  = base3 > 0 ? (totalNet3 / base3) * 100 : null;

  var npv = -I0;
  for (var t = 1; t <= HORIZON; t++) npv += cf[t-1] / Math.pow(1 + r, t / 12);

  var y1 = 0, y2 = 0;
  for (var a = 0; a < 12; a++) y1 += humanAt(a) - residualAt(a) - robotAccrual;
  for (var b = 12; b < 24; b++) y2 += humanAt(b) - residualAt(b) - robotAccrual;

  return {
    demand: demand, workHours: workHours, headsAuto: headsAuto, nAuto: nAuto,
    heads: heads, machines: n, powerPerRobot: v.power,
    humanTotal: humanAt(0), residualTotal: residualAt(0), robotAccrual: robotAccrual,
    monthlyNet: monthlyNet, year1: y1, year2: y2,
    I0: I0, cf: cf, cum: cum, payback: payback,
    totalNet3: totalNet3, totalSave3: totalSave3, base3: base3, roi3: roi3, npv: npv,
    capacity: n * v.hours * v.eff,
    util: n * v.hours * v.eff > 0 ? (demand / (n * v.hours * v.eff)) * 100 : null,
    perUnit: n > 0 ? robotAccrual / n : 0,
    seg:{
      equip: mode === "lease" ? n * v.rent : n * (v.price / (v.life * 12)),
      maint: n * v.maint,
      power: n * v.power,
      resid: residualAt(0)
    }
  };
}

/* ---------------- B. 酒店配送场景（W3 跨楼层客房配送） ----------------
   客人数/天   paxDay = 房间数 × 满房率 × 每房人数
   需求次数/天 trips  = paxDay × Σ需求频率
   单次分钟    t      = dist ÷ 速度 ÷ 60 + 每次层数 × 每层等电梯 × 2 + 沟通
   所需人数    = ⌈trips ÷ 高峰单机运力⌉，运力 = 高峰时长 × 60 ÷ (t ÷ 能力因素)
   单人月成本  = 月薪 + 月薪×社保 + (月薪÷月计薪天数)×每月休假天数 + 月薪×招聘占比÷离职月数
   单机月成本  = 租赁÷租赁周期 + 部署÷租赁周期 + (租赁÷租赁周期)×维护占比
*/
function computeHotel(v){
  var paxDay = v.rooms * v.occ * v.pax;
  var rate   = v.dDrink + v.dFood + v.dItem + v.dOther;
  var trips  = paxDay * rate;

  var dist   = v.lobbyD + v.corridor;
  var lift   = v.tripFloors * v.liftWait * 2;
  var tHuman = dist / v.vHuman / 60 + lift + v.talk;
  var tRobot = dist / v.vRobot / 60 + lift + v.talk;

  var hHuman = trips * tHuman / 60 / v.fHuman;
  var hRobot = trips * tRobot / 60 / v.fRobot;

  var capHuman = (v.peak * 60) / (tHuman / v.fHuman);
  var capRobot = (v.peak * 60) / (tRobot / v.fRobot);

  var nHuman = Math.max(1, Math.ceil(trips / capHuman));
  var nRobot = Math.max(1, Math.ceil(trips / capRobot));

  var leavePerMonth = Math.round((v.leave + v.holiday) / 12);
  var salaryC   = v.salary;
  var socialC   = v.salary * v.social;
  var vacationC = (v.salary / v.payDays) * leavePerMonth;
  var hireC     = (v.salary * v.hire) / v.tenure;
  var perHuman  = salaryC + socialC + vacationC + hireC;

  var leaseM_  = v.lease / v.leaseM;
  var deployM  = v.deploy / v.leaseM;
  var maintM   = leaseM_ * v.maintR;
  var perRobot = leaseM_ + deployM + maintM;

  var laborTotal = nHuman * perHuman;
  var robotTotal = nRobot * perRobot;
  var monthlyNet = laborTotal - robotTotal;

  return {
    paxDay: paxDay, trips: trips, dist: dist, lift: lift,
    tHuman: tHuman, tRobot: tRobot, hHuman: hHuman, hRobot: hRobot,
    capHuman: capHuman, capRobot: capRobot,
    nHuman: nHuman, nRobot: nRobot, machines: nRobot,
    leavePerMonth: leavePerMonth,
    salaryC: salaryC, socialC: socialC, vacationC: vacationC, hireC: hireC,
    perHuman: perHuman, leaseM: leaseM_, deployM: deployM, maintM: maintM, perRobot: perRobot,
    humanTotal: laborTotal, residualTotal: 0, robotAccrual: robotTotal,
    monthlyNet: monthlyNet, year1: monthlyNet * 12, year2: monthlyNet * 12,
    I0: 0, payback: null,
    cf: (function(){ var a = []; for (var i = 0; i < HORIZON; i++) a.push(monthlyNet); return a; })(),
    cum: (function(){ var a = [0]; for (var i = 0; i < HORIZON; i++) a.push(a[i] + monthlyNet); return a; })(),
    totalNet3: monthlyNet * HORIZON, totalSave3: laborTotal * HORIZON,
    base3: robotTotal * HORIZON,
    roi3: robotTotal > 0 ? (monthlyNet / robotTotal) * 100 : null,
    npv: monthlyNet * HORIZON,
    capacity: capRobot, util: trips > 0 ? (trips / capRobot) * 100 : null,
    perUnit: perRobot,
    seg:{ equip: nRobot * leaseM_, maint: nRobot * (deployM + maintM), power: 0, resid: 0 }
  };
}

/* ---------------- C. 餐饮配送场景（T8 / T10 / T11，官方 $ 口径） ----------------
   单次任务时长 Y = A + B + C + D
     A = 往返距离 ÷ 步行速度（s）｜B = 起点操作（s）｜C = 终点操作（s）｜D = 等待（s）
   每小时任务数 Z = 3600 ÷ Y
   所需机器人台数 = ⌈峰值小时需求 ÷ (每单份数 E × Z)⌉
*/
function computeCatering(v){
  var g = v.growth / 100, r = v.rate / 100;

  var A = v.vSpeed > 0 ? v.tripDist / v.vSpeed : 0;
  var Y = A + v.opB + v.opC + v.wait;
  var Z = Y > 0 ? 3600 / Y : 0;
  var perRobotHour = v.perOrder * Z;
  var needRaw = perRobotHour > 0 ? v.peakDemand / perRobotHour : 0;
  var nNeed = Math.max(1, Math.ceil(needRaw - 1e-9));
  var nPlan = Math.max(1, Math.round(v.nPlan));

  var wkHeadsKeep = Math.max(0, v.wkHeads - v.replace);
  var weHeadsKeep = Math.max(0, v.weHeads - v.replace);
  var wkHYear = v.wkHours * v.wkDays * v.weeks;
  var weHYear = v.weHours * v.weDays * v.weeks;
  var hoursFull   = wkHYear * v.wkHeads + weHYear * v.weHeads;
  var hoursCollab = wkHYear * wkHeadsKeep + weHYear * weHeadsKeep;

  var laborFullYear   = hoursFull * v.wage;
  var laborCollabYear = hoursCollab * v.wage;
  var rentYear        = nPlan * v.rent * 12;
  var collabYear      = laborCollabYear + rentYear;
  var saveYear        = laborFullYear - collabYear;

  function wageScale(m){ return Math.pow(1 + g, Math.floor(m / 12)); }
  function netAt(m){
    return ((laborFullYear - laborCollabYear) / 12) * wageScale(m) - rentYear / 12;
  }
  var monthlyNet = netAt(0);

  var I0 = 0;
  var cf = [], cum = [0];
  for (var m = 0; m < HORIZON; m++){ cf.push(netAt(m)); cum.push(cum[m] + cf[m]); }

  var totalNet3 = 0, totalSave3 = 0, totalCost3 = 0;
  for (var s = 0; s < HORIZON; s++){
    totalNet3  += netAt(s);
    totalSave3 += (laborFullYear / 12) * wageScale(s);
    totalCost3 += (laborCollabYear / 12) * wageScale(s) + rentYear / 12;
  }
  var base3 = HORIZON * nPlan * v.rent;
  var roi3  = base3 > 0 ? (totalNet3 / base3) * 100 : null;

  var npv = 0;
  for (var t = 0; t < HORIZON; t++) npv += cf[t] / Math.pow(1 + r, (t + 1) / 12);

  var capacity = nPlan * perRobotHour;

  return {
    A: A, Y: Y, Z: Z, perRobotHour: perRobotHour,
    needRaw: needRaw, nNeed: nNeed, nPlan: nPlan, machines: nPlan,
    wkHYear: wkHYear, weHYear: weHYear, hoursFull: hoursFull, hoursCollab: hoursCollab,
    wkHeadsKeep: wkHeadsKeep, weHeadsKeep: weHeadsKeep,
    laborFullYear: laborFullYear, laborCollabYear: laborCollabYear,
    rentYear: rentYear, rentMonth: nPlan * v.rent, collabYear: collabYear, save: saveYear,
    humanTotal: laborFullYear, robotAccrual: collabYear, residualTotal: laborCollabYear,
    monthlyNet: monthlyNet, year1: saveYear, year2: saveYear,
    I0: I0, cf: cf, cum: cum, payback: null,
    totalNet3: totalNet3, totalSave3: totalSave3, totalCost3: totalCost3,
    base3: base3, roi3: roi3, npv: npv,
    capacity: capacity,
    util: capacity > 0 ? (v.peakDemand / capacity) * 100 : null,
    perUnit: v.rent,
    seg:{ labor: laborCollabYear, rent: rentYear }
  };
}

/* ---------------- D. 国家人工成本口径 ----------------
   场景 → NACE 行业码：
     餐饮 / 娱乐 / 酒店 → I（住宿餐饮）｜医疗养老 → Q（医疗社会工作）｜其余 → N
   异常判定：数据集里带 flags 的格子不能用，必须回退为工资估算并在页面标注。
   清洁口径：lc_lci_lev 无 N81 子类、大类 N 混入人力派遣与安保 → 用工资法。
*/
var NACE_OF_CAT = {food:"I", entertainment:"I", hotel:"I", medical:"Q", retail:"N",
                   office:"N", industrial:"N", transport:"N"};
var CELL_OF_NACE = {I:"accommodation_food_I", N:"admin_support_N", Q:"health_social_Q"};
/* 雇主非工资成本占比：Eurostat lc_lci_lev 的 D12(非工资) ÷ (D11 工资 + D12 非工资)。
   可靠区间 4%–55%，超出即源数据异常（NL/RS/CZ/SI/BG/RO）→ 数据集置 null，页面显示「—」。 */
var NONWAGE_LO = 0.04, NONWAGE_HI = 0.55;

function naceOfCategory(cat){ return NACE_OF_CAT[cat] || "N"; }

/* 格子是否带异常/过期标记（键形如 labour_I_stale_2016 / labour_I_anomaly） */
function cellFlag(country, code){
  var hits = (country.flags || []).filter(function(f){
    return f.indexOf("labour_" + code + "_") === 0;
  });
  return hits.length ? hits[0] : null;
}
function flagKind(flag){
  if (!flag) return null;
  if (flag.indexOf("_anomaly") > 0) return "anomaly";
  if (flag.indexOf("_stale") > 0) return "stale";
  if (flag.indexOf("_low_relative") > 0) return "low_relative";
  if (flag.indexOf("_unverifiable") > 0) return "unverifiable";
  return "other";
}

function hasWage(country){
  return !!(country.wage_median_eur_month && isFinite(country.wage_median_eur_month.value));
}
/* 雇主非工资成本占比（页面显示为 %，用于工资法估算的 (1 + 占比) 乘数）
   ⚠ 绝不能改用 ratio_sector_cost_over_median_wage：那是「行业成本 ÷ 全经济中位数工资 − 1」，
     把「行业内非低薪岗位拉高平均」也算进了社保（DE 会得出 69.6%，实际非工资占比 22.6%）。
   数据集里占比超出可信区间（4%–55%）的国家置 null + nonwage_unreliable →
   这里返回 value:null，页面显示「—」并要求手填，不印假数。 */
function nonwageOf(country){
  var ns = country.employer_nonwage_share;
  var measured = !!(ns && isFinite(ns.share));
  return {
    value: measured ? ns.share : null,
    assumed: !measured,
    unreliable: !measured,
    year: measured ? ns.year : null,
    nace: measured ? ns.nace : null
  };
}
function socialRateOf(country){ return nonwageOf(country); }
function medianWageOf(country){
  return hasWage(country) ? country.wage_median_eur_month.value : null;
}
function minWageOf(country){
  return (country.min_wage_eur_month && isFinite(country.min_wage_eur_month.value))
    ? country.min_wage_eur_month.value : null;
}

/* 工资法估算：中位数工资 × (1 + 雇主非工资成本占比) × 岗位系数（默认 0.8，页面显式标为假设）
   占比不可用（源数据可疑）或该国无工资数据 → 不给估算，页面显示 [待补] 要求手填 */
function wageBasisMonthly(country, jobFactor){
  var med = medianWageOf(country);
  var sr = socialRateOf(country);
  if (med === null || sr.value === null) return null;
  return med * (1 + sr.value) * jobFactor;
}

/* 行业法估算：NACE 行业成本 €/h × 月工时
   返回 {value, basis:"industry"|"wage"|null, hourCost, year, flag, flagKind, socialAssumed} */
function labourMonthly(country, kind, opts){
  opts = opts || {};
  var mh = opts.monthHours === undefined ? 173.3 : opts.monthHours;
  var jf = opts.jobFactor === undefined ? 0.8 : opts.jobFactor;
  var code = opts.nace || "I";
  var res = { value: null, basis: null, hourCost: null, year: null, nace: code,
              flag: null, flagKind: null, socialAssumed: false };

  if (kind === "industry"){
    var flag = cellFlag(country, code);
    var cell = country.labour_cost_hour_eur ? country.labour_cost_hour_eur[CELL_OF_NACE[code]] : null;
    if (!flag && cell && isFinite(cell.value)){
      res.value = cell.value * mh;
      res.basis = "industry";
      res.hourCost = cell.value;
      res.year = cell.year;
      return res;
    }
    res.flag = flag;
    res.flagKind = flagKind(flag);
  }
  /* 工资法回退（也可能是清洁场景的正常口径） */
  var sr = socialRateOf(country);
  res.socialAssumed = sr.assumed;
  res.value = wageBasisMonthly(country, jf);
  res.basis = res.value === null ? null : "wage";
  res.jobFactor = jf;
  res.socialRate = sr.value;
  if (res.year === null && country.wage_median_eur_month) res.year = country.wage_median_eur_month.year;
  return res;
}

/* ---------------- E. 组合引擎 ----------------
   台数：官方比例（ceil，下限 1；驱动参数缺失 → 剔除，不给 0 台）
   T10 在有餐桌数时用「每 15 桌 1 台」；否则退回餐饮运力公式；都没有 → 剔除
   T8/T3/S300 无官方比例 → 只在填了峰值单量时按运力公式算，否则剔除
   T11（T10 窄道版）同样无桌数比例 → 峰值法；窄道场景由 planCombo 把 T10 换过去
   X101 / M102 是医疗新品：默认只作候选，勾了「纳入测算（演示用）」才进台数

   机型清单是白名单制的：只有 combo-data.json 的 overseas_mainline 里的机型能进组合。
   引导/迎宾机型已整条下架：数据、六语言文案、台数规则里都不再出现。
*/
var SIZING = {
  C40:  {kind:"ratio", driver:"area_m2", div:2000},
  C30:  {kind:"ratio", driver:"area_m2", div:1250},
  C55:  {kind:"ratio", driver:"area_m2", div:5000},
  W3:   {kind:"ratio", driver:"rooms",   div:100},
  S100: {kind:"ratio", driver:"rooms",   div:100},
  T9:   {kind:"ratio", driver:"tables",  div:20},
  T10:  {kind:"tables_then_peak", driver:"tables", div:15},
  T8:   {kind:"peak"},
  T11:  {kind:"peak", narrowOf:"T10"},
  T3:   {kind:"peak"},
  S300: {kind:"peak"},
  /* 医疗新品：台数沿用同场景里最接近的官方比例（X101 ≈ W3 的跨楼层配送、
     M102 ≈ S100 的物资搬运），页面显式标注「沿用 W3/S100 口径 · 页面假设 · 演示用」。 */
  X101: {kind:"ratio", driver:"rooms", div:100, upcoming:true, assumes:"W3"},
  M102: {kind:"ratio", driver:"rooms", div:100, upcoming:true, assumes:"S100"},
  Tracker:{kind:"seat", accessory:true, note:"seat"}
};

/* 海外主力机型白名单（combo-data.json overseas_mainline.models）。
   组合引擎只认这份清单；新品（upcoming）与配件（accessory）另行放行。 */
var MAINLINE = (COMBO_DATA.overseas_mainline && COMBO_DATA.overseas_mainline.models) || [];
function isMainline(id){ return MAINLINE.indexOf(id) >= 0; }
/* 医疗新品候选（combo-data.json upcoming_products.models） */
var UPCOMING = (COMBO_DATA.upcoming_products && COMBO_DATA.upcoming_products.models) || [];
function isUpcoming(id){ return UPCOMING.indexOf(id) >= 0; }
/* 配件（combo-data.json accessories）：不是机器人，不算台数、不进 ROI */
function isAccessory(id){
  return !!(COMBO_DATA.accessories && COMBO_DATA.accessories[id]);
}
/* 窄道替代关系：{T10: "T11"} —— 由 SIZING 里的 narrowOf 反查得出，不另立一份表 */
var NARROW_SWAP = (function(){
  var m = {};
  Object.keys(SIZING).forEach(function(id){
    var base = SIZING[id].narrowOf;
    if (base && isMainline(id)) m[base] = id;
  });
  return m;
})();

/* 各机型缺驱动参数时页面要提示填哪个字段 */
var DRIVER_LABEL = {area_m2:"area_m2", rooms:"rooms", tables:"tables", peak_orders:"peak_orders"};

/* 接送/送餐机型的人工替代当量：Z（次/h，机器人）× 人工单趟分钟 ÷ 60 = 人/台 */
var TRIP_PROFILE = {
  T10:{opB:10, opC:20, wait:0,  perOrder:2,  assumed:false},
  T9: {opB:40, opC:20, wait:30, perOrder:10, assumed:false},
  T8: {opB:15, opC:30, wait:0,  perOrder:6,  assumed:true},
  /* T11 是 T10 的窄道版，运力参数沿用 T10 那一组（combo-data.json 无 T11 官方运力表）
     —— 标成假设值，卡上出琥珀色徽章，别让人当成 datasheet 数字。 */
  T11:{opB:10, opC:20, wait:0,  perOrder:2,  assumed:true},
  T3: {opB:8,  opC:15, wait:0,  perOrder:1,  assumed:true}
};
/* 无官方比例的机型的人工替代当量：页面假设值（琥珀色标记） */
var EQ_ASSUMED = {S100:0.50, S300:0.35, X101:0.50, M102:0.50, Tracker:0};

function ceilDiv(n, d){ return d > 0 ? Math.ceil(n / d - 1e-9) : 0; }

/* 餐饮运力公式：返回 {Y, Z, perOrder, assumed} */
function tripCapacity(p){
  var Y = p.tripDist / p.vSpeed + p.opB + p.opC + p.wait;
  return { Y: Y, Z: Y > 0 ? 3600 / Y : 0,
           humanMin: p.tripDist / p.humanSpeed / 60 + (p.opB + p.opC + p.wait) / 60,
           perOrder: p.perOrder, assumed: !!p.assumed };
}

/* 机型人工替代当量（人/台）。
   ctx: {labourRate:125, shiftHours:8, occ, pax, demandRate, tHuman, vSpeed, humanSpeed, tripDist} */
function machineEquivalent(id, ctx){
  if (id === "C40" || id === "C30" || id === "C55"){
    var cov = SIZING[id].div;
    return { eq: cov / (ctx.labourRate * ctx.shiftHours), kind:"area", upt: cov,
             assumed:false, terms:{upt:cov, rate:ctx.labourRate, shift:ctx.shiftHours} };
  }
  if (id === "W3" || id === "S100" || id === "S300"){
    if (id === "W3"){
      var trips = 100 * ctx.occ * ctx.pax * ctx.demandRate;
      return { eq: trips * ctx.tHuman / 60 / ctx.shiftHours, kind:"trips",
               tripsPerMachine: trips, tHuman: ctx.tHuman, assumed:false,
               terms:{trips:trips, tHuman:ctx.tHuman, shift:ctx.shiftHours} };
    }
    return { eq: EQ_ASSUMED[id], kind:"assumed", assumed:true };
  }
  if (TRIP_PROFILE[id]){
    var cap = tripCapacity({
      tripDist: ctx.tripDist, vSpeed: ctx.vSpeed, humanSpeed: ctx.humanSpeed,
      opB: TRIP_PROFILE[id].opB, opC: TRIP_PROFILE[id].opC,
      wait: TRIP_PROFILE[id].wait, perOrder: TRIP_PROFILE[id].perOrder
    });
    return { eq: cap.Z * cap.humanMin / 60, kind:"peak", Z: cap.Z,
             humanMin: cap.humanMin, perOrder: cap.perOrder, assumed: cap.assumed,
             terms:{Z:cap.Z, humanMin:cap.humanMin} };
  }
  return { eq: EQ_ASSUMED[id] || 0, kind:"assumed", assumed:true };
}

/* 推荐组合：官方组合 + 痛点追加 → 逐个算台数 */
function planCombo(inp, scen, data, opts){
  opts = opts || {};
  var eqCtx = {
    labourRate: num0(opts.labourRate, 125),
    shiftHours: num0(opts.shiftHours, 8),
    occ: num0(opts.occ, 0.54),
    pax: num0(opts.pax, 1.5),
    demandRate: num0(opts.demandRate, 0.9),
    tHuman: num0(opts.tHuman, 5.366667),
    vSpeed: num0(opts.vSpeed, 0.5),
    humanSpeed: num0(opts.humanSpeed, 1.0),
    tripDist: num0(opts.tripDist, 50)
  };
  var pains = {};
  (opts.pains || []).forEach(function(p){ pains[p] = true; });

  var ids = (scen.combo || []).slice();
  var fromPain = {};
  Object.keys(data.pain_points || {}).forEach(function(pid){
    if (!pains[pid]) return;
    (data.pain_points[pid].push || []).forEach(function(mid){
      if (ids.indexOf(mid) < 0){ ids.push(mid); fromPain[mid] = true; }
    });
  });
  /* 医疗/养老场景的候选新品：默认只是"被提名"，勾了纳入测算才真的进组合 */
  (scen.upcoming_products || []).forEach(function(mid){
    if (ids.indexOf(mid) < 0) ids.push(mid);
  });

  var peak = num0(inp.peak_orders, 0);
  var includeUpcoming = opts.includeUpcoming === true;
  var narrow = opts.narrow === true;
  var items = [], excluded = [], swapped = {};
  ids.forEach(function(id){
    var rule = SIZING[id];
    if (!rule){ excluded.push({ id:id, why:"no_rule" }); return; }
    /* 只认海外主力清单：不在清单里的机型（已下架的那两款）不许进组合 */
    if (!rule.upcoming && !rule.accessory && !isMainline(id)){
      excluded.push({ id:id, why:"not_mainline" }); return;
    }
    /* 医疗新品：默认不进台数计算，只作候选展示 */
    if (rule.upcoming && !includeUpcoming){
      excluded.push({ id:id, why:"upcoming" }); return;
    }
    /* 窄道/老楼：T10 换成窄道版 T11（台数规则随之走 T11 的峰值法） */
    if (narrow && NARROW_SWAP[id]){
      var slim = NARROW_SWAP[id];
      swapped[id] = slim;
      id = slim; rule = SIZING[slim];
    }
    var count = 0, basis = "", why = null;

    if (rule.kind === "ratio"){
      var dv = num0(inp[rule.driver], 0);
      if (dv > 0){ count = Math.max(1, ceilDiv(dv, rule.div)); basis = rule.driver; }
      else why = "missing:" + rule.driver;
    } else if (rule.kind === "tables_then_peak"){
      var tb = num0(inp.tables, 0);
      if (tb > 0){ count = Math.max(1, ceilDiv(tb, rule.div)); basis = "tables"; }
      else if (peak > 0){
        count = peakMachineCount(id, peak, eqCtx); basis = "peak";
        if (count <= 0) why = "missing:peak_orders";
      } else why = "missing:peak_orders";
    } else if (rule.kind === "peak"){
      if (peak > 0){
        count = peakMachineCount(id, peak, eqCtx); basis = "peak";
        if (count <= 0) why = "missing:peak_orders";
      } else why = "missing:peak_orders";
    } else if (rule.kind === "fixed"){
      count = rule.count; basis = "fixed";
    } else if (rule.kind === "seat"){
      why = "seat";
    }

    if (count > 0){
      var eq = machineEquivalent(id, eqCtx);
      items.push({ id:id, count:count, basis:basis, rule:rule,
                   fromPain: !!fromPain[id], eq: eq.eq, eqInfo: eq });
    } else {
      excluded.push({ id:id, why:why, fromPain: !!fromPain[id] });
    }
  });

  return { items: items, excluded: excluded, ids: ids, eqContext: eqCtx,
           swapped: swapped, narrow: narrow, includeUpcoming: includeUpcoming,
           upcomingIds: (scen.upcoming_products || []).slice() };
}
/* 把 excluded 拆成三类：真正的"这次没算"、医疗新品候选、配件。
   三者语义不同，页面上要分三块展示，不能混在一格里。 */
function splitExcluded(plan){
  var acc = [], up = [], rest = [];
  plan.excluded.forEach(function(e){
    if (isAccessory(e.id)) acc.push(e);
    else if (e.why === "upcoming" || isUpcoming(e.id)) up.push(e);
    else rest.push(e);
  });
  return { accessories: acc, upcoming: up, excluded: rest };
}

/* 用餐饮运力公式把「峰值单量」换成台数（T8/T3/S300/T11 与无桌数的 T10） */
function peakMachineCount(id, peak, ctx){
  var prof = TRIP_PROFILE[id];
  if (!prof || peak <= 0) return 0;
  var cap = tripCapacity({
    tripDist: ctx.tripDist, vSpeed: ctx.vSpeed, humanSpeed: ctx.humanSpeed,
    opB: prof.opB, opC: prof.opC, wait: prof.wait, perOrder: prof.perOrder
  });
  var perRobotHour = cap.perOrder * cap.Z;
  return perRobotHour > 0 ? Math.max(1, Math.ceil(peak / perRobotHour - 1e-9)) : 0;
}

/* 组合成本与 ROI
   ctx: {items:[{id,count,eq}], monthlyLabourCost, baseRent, leaseM, maintR,
         factor:{}, powerPer:{}, mode, growth, rate} */
function computeCombo(plan, ctx){
  var g = ctx.growth / 100, r = ctx.rate / 100;
  var mode = ctx.mode || "lease";

  /* 每台月租 = 基准月租 × 机型系数；购置价 = 月租 × 租赁周期（同一量级，便于两种模式对比） */
  function rentOf(id){ return ctx.baseRent * num0(ctx.factor[id], 1); }
  function maintOf(id){ return rentOf(id) * ctx.maintR; }
  function powerOf(id){ return num0(ctx.powerPer[id], 0); }
  /* 账面月成本：租赁与购买都按同一量级摊月（购买时是折旧 + 维护 + 电费） */
  function accrualOf(id){ return rentOf(id) + maintOf(id) + powerOf(id); }
  /* 现金月流出：购买模式不含折旧，本金记在第 0 月 */
  function cashOf(id){ return (mode === "lease" ? rentOf(id) : 0) + maintOf(id) + powerOf(id); }

  var savedM = 0, costM = 0, cashM = 0, units = 0, eqTotal = 0, I0 = 0;
  var rentTotal = 0, maintTotal = 0, powerTotal = 0;
  var perModel = [];
  plan.items.forEach(function(it){
    var m = (ctx.counts && ctx.counts[it.id] !== undefined) ? ctx.counts[it.id] : it.count;
    var eq = it.eq * m;
    savedM += eq * ctx.monthlyLabourCost;
    costM  += accrualOf(it.id) * m;
    cashM  += cashOf(it.id) * m;
    units  += m;
    eqTotal += eq;
    rentTotal  += rentOf(it.id) * m;
    maintTotal += maintOf(it.id) * m;
    powerTotal += powerOf(it.id) * m;
    if (mode === "purchase") I0 += rentOf(it.id) * ctx.leaseM * m;
    perModel.push({ id:it.id, count:m, eq:eq, eqPer:it.eq,
                    accrued:accrualOf(it.id) * m, cash:cashOf(it.id) * m,
                    rent:rentOf(it.id), maint:maintOf(it.id), power:powerOf(it.id) });
  });

  var monthlyNet = savedM - costM;
  function savedAt(m){ return savedM * Math.pow(1 + g, Math.floor(m / 12)); }

  var cf = [], cum = [-I0];
  for (var m2 = 0; m2 < HORIZON; m2++){
    var c = savedAt(m2) - cashM;
    cf.push(c);
    cum.push(cum[m2] + c);
  }

  var payback = null;
  if (I0 > 0){
    if (cum[1] >= 0) payback = 0;
    else for (var q = 1; q <= HORIZON; q++){
      if (cum[q] >= 0){
        var span = cum[q] - cum[q-1];
        payback = (q - 1) + (span > 0 ? (-cum[q-1]) / span : 0);
        break;
      }
    }
  }

  var totalNet3 = 0, totalSave3 = 0;
  for (var s = 0; s < HORIZON; s++){
    totalNet3  += savedAt(s) - costM;
    totalSave3 += savedAt(s);
  }
  var base3 = mode === "purchase" ? I0 : HORIZON * costM;
  var roi3  = base3 > 0 ? (totalNet3 / base3) * 100 : null;

  var npv = -I0;
  for (var t = 1; t <= HORIZON; t++) npv += cf[t-1] / Math.pow(1 + r, t / 12);

  return {
    items: plan.items, perModel: perModel, excluded: plan.excluded,
    units: units, eqTotal: eqTotal, monthlySaved: savedM, monthlyCost: costM,
    monthlyNet: monthlyNet, year1: monthlyNet * 12, year2: monthlyNet * 12,
    I0: I0, cf: cf, cum: cum, payback: payback, mode: mode,
    totalNet3: totalNet3, totalSave3: totalSave3, base3: base3, roi3: roi3, npv: npv,
    humanTotal: savedM, residualTotal: 0, robotAccrual: costM,
    machines: units, util: null, perUnit: units > 0 ? costM / units : 0,
    seg:{ equip: rentTotal, maint: maintTotal, power: powerTotal, resid: 0 }
  };
}
function num0(x, dflt){
  var n = typeof x === "number" ? x : parseFloat(x);
  return isFinite(n) ? n : dflt;
}
/* === PURE-MATH-END === */
/* ============================================================
   1. 数字与货币本地化
   ------------------------------------------------------------
   不依赖 Intl：分组符、小数符、货币符号位置都由这张表决定，
   所以"同输入同结果、只换格式"是可验证的。
   ============================================================ */
/* === FMT-BEGIN === */
var FMT = { zh:{grp:",", dec:".", symPre:true }, "zh-TW":{grp:",", dec:".", symPre:true },
  en:{grp:",", dec:".", symPre:true }, de:{grp:".", dec:",", symPre:false}, it:{grp:".", dec:",", symPre:false},
  fr:{grp:".", dec:",", symPre:false}, es:{grp:".", dec:",", symPre:false}, nl:{grp:".", dec:",", symPre:false},
  "pt-BR":{grp:".", dec:",", symPre:true}, ja:{grp:",", dec:".", symPre:true }, ko:{grp:",", dec:".", symPre:true },
  vi:{grp:".", dec:",", symPre:false}, ru:{grp:".", dec:",", symPre:false} };
/* 每欧元兑多少本币；EUR 为基准。countries 里的 fx_to_eur 就是「1 € = ? 本币」，
   与字段名相反但语义如此（CH 0.937 / SE 11.0663 / CZ 24.688 都能对上）。 */
var CUR_META = {
  EUR:{sym:"€",   year:"2025"},
  USD:{sym:"$",   year:"2025"},   /* 官方餐饮口径隐含汇率，页面默认值，可编辑 */
  GBP:{sym:"£",   year:"2025"},
  CHF:{sym:"CHF", year:"2025"},
  SEK:{sym:"kr",  year:"2025"},
  NOK:{sym:"kr",  year:"2025"},
  DKK:{sym:"kr",  year:"2025"},
  PLN:{sym:"zł",  year:"2025"},
  CZK:{sym:"Kč",  year:"2025"},
  HUF:{sym:"Ft",  year:"2025"},
  RON:{sym:"lei", year:"2025"},
  BGN:{sym:"лв",  year:"2024"},   /* 保加利亚 2026-01 入欧元区，BGN 为固定历史汇率 */
  TRY:{sym:"₺",   year:"2025"},
  RSD:{sym:"din", year:"2025"}
};
var CUR_ORDER = ["EUR","USD","GBP","CHF","SEK","NOK","DKK","PLN","CZK","HUF","RON","BGN","TRY","RSD"];
var RATES = {};                  /* CCY -> 每欧元本币数 */
function curSym(code){ return (CUR_META[code] || {sym:code}).sym; }

function grp3(str, lang){
  var f = FMT[lang];
  return str.replace(/\B(?=(\d{3})+(?!\d))/g, "\u0000").split("\u0000").join(f.grp);
}
/* 纯数字 */
function fmtNum(v, dec, lang){
  if (v === null || v === undefined || !isFinite(v)) return "—";
  var f = FMT[lang];
  var neg = v < 0;
  var s = Math.abs(v).toFixed(dec);
  var parts = s.split(".");
  var out = grp3(parts[0], lang) + (parts.length > 1 ? f.dec + parts[1] : "");
  return (neg ? "-" : "") + out;
}
/* 带货币符号 */
function fmtMoney(v, dec, lang, cur){
  if (v === null || v === undefined || !isFinite(v)) return "—";
  var f = FMT[lang];
  var sym = curSym(cur);
  var body = fmtNum(Math.abs(v), dec, lang);
  var sign = v < 0 ? "-" : "";
  return f.symPre ? sign + sym + body : sign + body + " " + sym;
}
function fmtPct(v, dec, lang){ return v === null || !isFinite(v) ? "—" : fmtNum(v, dec === undefined ? 1 : dec, lang) + "%"; }
/* === FMT-END === */

/* 汇率表由国家数据集构建（依赖 COUNTRY_DATA，故放在纯格式块之外） */
function buildRates(){
  RATES = {EUR:1, USD:1.0870, BGN:1.9558};   /* USD / BGN 为页面默认值 */
  var cs = COUNTRY_DATA.countries;
  Object.keys(cs).forEach(function(k){
    var fx = cs[k].fx_to_eur;
    if (cs[k].currency && fx && !RATES[cs[k].currency]) RATES[cs[k].currency] = fx;
  });
  /* 内置快照兜底（update-fx.py 刷新它，值同 country-data.json） */
  if (window.FX_SNAPSHOT){
    Object.keys(window.FX_SNAPSHOT).forEach(function(iso){
      var s = window.FX_SNAPSHOT[iso];
      if (s && s.cur && isFinite(s.fx) && s.fx > 0 && !RATES[s.cur]) RATES[s.cur] = s.fx;
    });
  }
  if (!RATES.USD) RATES.USD = 1.0870;
  FX.auto = {};
  Object.keys(RATES).forEach(function(c){ FX.auto[c] = RATES[c]; });
}

/* ============================================================
   1b. 实时汇率
   ------------------------------------------------------------
   取值链（三个源都在页面里，各带一个解析分支）：
     ① jsDelivr currency-api  —— data.eur.<小写币种>，data.date（ECB 口径，即 ECB 官方表）
     ② open.er-api.com        —— data.rates.<大写币种>，data.time_last_update_utc
     ③ ECB 官方日更 XML        —— currency='XXX' rate='…'，time='YYYY-MM-DD'
     ④ 全失败 → 内置快照 window.FX_SNAPSHOT，状态显示「离线快照 · 日期」
   失败原因只 console.warn，不弹窗打断。

   为什么 ECB 官方 XML 不在第一位（实测，非推断）：
     带 Origin 请求 https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml，
     返回 200 但**没有任何 access-control-allow-origin 头**（Origin 为 http://… 或 null 都一样），
     浏览器 fetch 读不到响应体，只会抛 CORS 错。所以把它放在两个 CORS 开放的源之后，
     只在①②都挂时才试它 —— 这样正常加载不会每次都往控制台丢一条 CORS 报错。
     ECB 的汇率值仍会照常进页面：①jsDelivr currency-api 的表就是 ECB 官方口径（标签写 ECB）。

   汇率只用于「展示换算」：ROI 始终在基准币种上算，
   刷新汇率与切换展示币种都不会改写任何输入值（state.v / state.combo 不动）。
   ============================================================ */
var FX_URL_ECB = "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml";
var FX_URL_JSD = "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json";
var FX_URL_ER  = "https://open.er-api.com/v6/latest/EUR";
var FX_TIMEOUT_MS = 8000;

var FX = {
  mode:"snapshot",         /* live | snapshot | failed */
  label:"snapshot",        /* ECB | jsDelivr | er-api | snapshot */
  date:null,
  loading:false,
  fetched:null,            /* 上次成功的实时值：CCY -> 每欧元本币数 */
  auto:{},                 /* 自动解析出的权威表（快照 → 实时） */
  manual:{},               /* 用户手填：CCY -> 值；自动刷新不再覆盖 */
  tried:[]
};

function fxIsoDate(s){
  if (!s) return null;
  var m = String(s).match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[0] : null;
}
function fxSnapshotFor(ccy){
  var snap = window.FX_SNAPSHOT || {}, out = null;
  Object.keys(snap).forEach(function(iso){
    var s = snap[iso];
    if (s && s.cur === ccy && out === null) out = s.fx;
  });
  return out;
}
function fxSnapshotDate(){
  var snap = window.FX_SNAPSHOT || {}, out = null;
  Object.keys(snap).forEach(function(iso){
    var s = snap[iso];
    if (s && s.date && out === null) out = s.date;
  });
  return out;
}
/* 带超时的取数；任何一步失败都只返回 null，由调用方接手下一个源 */
function fxGet(url, asJson){
  return new Promise(function(resolve){
    var ctl = (typeof AbortController === "function") ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctl) ctl.abort(); resolve(null); }, FX_TIMEOUT_MS);
    var opts = {cache:"no-store"};
    if (ctl) opts.signal = ctl.signal;
    if (typeof fetch !== "function"){ clearTimeout(timer); resolve(null); return; }
    fetch(url, opts).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status + " " + url);
      return asJson ? r.json() : r.text();
    }).then(function(v){
      clearTimeout(timer); resolve(v);
    }).catch(function(e){
      clearTimeout(timer);
      console.warn("[fx] 取数失败，转下一个源：" + url, e && e.message ? e.message : e);
      resolve(null);
    });
  });
}
/* ① ECB 官方日更 XML */
function fxParseEcb(xml){
  if (typeof xml !== "string" || xml.indexOf("Cube") < 0) return null;
  var rates = {}, date = fxIsoDate((xml.match(/time=['"](\d{4}-\d{2}-\d{2})['"]/) || [])[1]);
  var re = /currency=['"]([A-Z]{3})['"]\s+rate=['"]([\d.]+)['"]/g, m;
  while ((m = re.exec(xml))){
    var v = parseFloat(m[2]);
    if (isFinite(v) && v > 0) rates[m[1]] = v;
  }
  if (!Object.keys(rates).length) return null;
  return {rates:rates, date:date, label:"ECB", url:FX_URL_ECB};
}
/* ② jsDelivr currency-api */
function fxParseJsdelivr(d){
  if (!d || !d.eur || typeof d.eur !== "object") return null;
  var rates = {};
  Object.keys(d.eur).forEach(function(k){
    var v = d.eur[k];
    if (isFinite(v) && v > 0) rates[String(k).toUpperCase()] = v;
  });
  if (!Object.keys(rates).length) return null;
  /* 这张表就是 ECB 官方日更口径，标签里把 ECB 一并写出来 */
  return {rates:rates, date:fxIsoDate(d.date), label:"ECB · jsDelivr", url:FX_URL_JSD};
}
/* ③ open.er-api.com */
function fxParseErapi(d){
  if (!d || !d.rates || typeof d.rates !== "object") return null;
  var rates = {};
  Object.keys(d.rates).forEach(function(k){
    var v = d.rates[k];
    if (isFinite(v) && v > 0) rates[String(k).toUpperCase()] = v;
  });
  if (!Object.keys(rates).length) return null;
  var date = null;
  if (d.time_last_update_utc){
    var dt = new Date(d.time_last_update_utc);
    if (!isNaN(dt.getTime())) date = dt.toISOString().slice(0, 10);
  }
  return {rates:rates, date:date, label:"er-api", url:FX_URL_ER};
}
/* 按序尝试三个源，任一成功即返回 */
function fxResolve(){
  FX.tried = [];
  var steps = [
    function(){ return fxGet(FX_URL_JSD, true ).then(function(d){ FX.tried.push("jsDelivr"); return fxParseJsdelivr(d); }); },
    function(){ return fxGet(FX_URL_ER,  true ).then(function(d){ FX.tried.push("er-api"); return fxParseErapi(d); }); },
    function(){ return fxGet(FX_URL_ECB, false).then(function(t){ FX.tried.push("ECB"); return fxParseEcb(t); }); }
  ];
  var i = 0;
  function step(){
    if (i >= steps.length) return Promise.resolve(null);
    var fn = steps[i++];
    return fn().then(function(res){ return res || step(); });
  }
  return step();
}
/* 把实时值写进 RATES，但不动任何输入值，也不覆盖用户手填的币种 */
function fxApplyRates(res){
  var auto = {};
  Object.keys(RATES).forEach(function(c){ auto[c] = RATES[c]; });
  Object.keys(res.rates).forEach(function(c){ auto[c] = res.rates[c]; });
  FX.auto = auto;
  Object.keys(auto).forEach(function(c){
    if (FX.manual[c] === undefined) RATES[c] = auto[c];
  });
  FX.fetched = res.rates;
  FX.mode = "live";
  FX.label = res.label;
  FX.date = res.date || fxSnapshotDate();
}
function fxStatusText(){
  if (FX.loading) return t("fx.badge.loading");
  if (FX.mode === "live") return t("fx.badge.live", {date: FX.date || "—", src: FX.label});
  if (FX.mode === "failed") return t("fx.badge.failed");
  return t("fx.badge.snapshot", {date: FX.date || fxSnapshotDate() || "—"});
}
function fxBadgeKind(){
  if (FX.loading) return "loading";
  return FX.mode;   /* live | snapshot | failed */
}
function fxBadgeHtml(){
  return '<span class="fxbadge" id="fxBadge" data-kind="' + fxBadgeKind() + '">'
       +   '<span id="fxBadgeText">' + esc(fxStatusText()) + '</span>'
       + '</span>'
       + '<span class="fx-man"' + (FX.manual[state.displayCur] === undefined ? " hidden" : "") + ' id="fxMan">'
       +   esc(t("fx.manual")) + '</span>';
}
function fxManualRefresh(){
  if (FX.loading) return;
  FX.loading = true;
  updateFxUi();
  fxResolve().then(function(res){
    FX.loading = false;
    if (res) fxApplyRates(res);
    else {
      FX.mode = "failed"; FX.label = "snapshot"; FX.date = null;
      console.warn("[fx] 三个实时源都取不到，改用内置快照。已尝试：" + (FX.tried.join(" → ") || "无"));
    }
    updateFxUi(true);
  });
}
/* 刷新后即时更新：徽章 + 所有换算。已经有徽章就只换徽章，
   免得整条口径条重绘把正在输入的焦点顶掉。 */
function updateFxUi(full){
  if ($("#fxBadge")){
    var b = $("#fxBadge");
    b.setAttribute("data-kind", fxBadgeKind());
    $("#fxBadgeText").textContent = fxStatusText();
    var man = $("#fxMan");
    if (man) man.hidden = (FX.manual[state.displayCur] === undefined);
    var inp = $("#inpFx");
    if (inp && document.activeElement !== inp) inp.value = (RATES[state.displayCur] || 1).toFixed(4);
    var clr = $("#btnFxClear");
    if (clr) clr.hidden = (FX.manual[state.displayCur] === undefined);
    var rb = $("#btnFxRefresh");
    if (rb) rb.disabled = !!FX.loading;
  } else if (full){
    renderCond();
  }
  if (full){ syncAllFields(); renderComboCards(); renderFoot(); schedule(true); }
}
function fxSetManual(ccy, val){
  if (!ccy || !isFinite(val) || val <= 0) return;
  FX.manual[ccy] = val;
  RATES[ccy] = val;
}
function fxClearManual(ccy){
  delete FX.manual[ccy];
  var v = FX.auto[ccy];
  if (v === undefined) v = fxSnapshotFor(ccy);
  if (v === undefined) v = (ccy === "EUR") ? 1 : RATES[ccy];
  RATES[ccy] = v;
}

/* ============================================================

var THEMES = ["auto", "light", "dark"];
var THEME_KEY = "botonomics.theme";
function themeStored(){
  try {
    var v = window.localStorage.getItem(THEME_KEY);
    return THEMES.indexOf(v) >= 0 ? v : null;
  } catch (e) { return null; }   /* 隐私模式下 localStorage 会抛 */
}
function themeStore(v){
  try { window.localStorage.setItem(THEME_KEY, v); } catch (e) { /* 存不了就算了 */ }
}
function themeMedia(){ return window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null; }
function themeResolved(){
  if (state.theme === "dark") return "dark";
  if (state.theme === "light") return "light";
  var m = themeMedia();
  return (m && m.matches) ? "dark" : "light";
}
/* 三个状态各配一个图标：跟随系统=半明半暗的圆，浅色=太阳，深色=月牙。
   图标跟文字一起换，读屏靠 aria-label，视觉靠图标 + 状态词。 */
var THEME_ICON = {
  auto:'<svg viewBox="0 0 16 16" width="13" height="13"><circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.9a6.1 6.1 0 0 1 0 12.2z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 16 16" width="13" height="13"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"/></g></svg>',
  dark:'<svg viewBox="0 0 16 16" width="13" height="13"><path d="M13.6 10.4A5.9 5.9 0 0 1 5.6 2.4a6.1 6.1 0 1 0 8 8z" fill="currentColor"/></svg>'
};
/* 循环顺序就是 THEMES 的顺序：跟随系统 → 浅色 → 深色 → 跟随系统 */
function nextTheme(v){
  var i = THEMES.indexOf(v);
  return THEMES[(i < 0 ? 0 : i + 1) % THEMES.length];
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme);
  var btn = $("#themeBtn");
  if (!btn) return;
  var ico = $("#themeIco"), lab = $("#themeBtnLabel");
  if (ico) ico.innerHTML = THEME_ICON[state.theme] || THEME_ICON.auto;
  if (lab) lab.textContent = t("theme." + state.theme);
  /* data-theme-state 是给验证脚本/截图脚本读的稳定钩子，不受文案影响 */
  btn.setAttribute("data-theme-state", state.theme);
  btn.setAttribute("aria-label", t("theme.btn", {state: t("theme." + state.theme),
                                                 next: t("theme." + nextTheme(state.theme))}));
  btn.title = t("theme.hint", {next: t("theme." + nextTheme(state.theme))});
}
function setTheme(v, persist){
  if (THEMES.indexOf(v) < 0 || v === state.theme) return;
  state.theme = v;
  if (persist !== false) themeStore(v);
  applyTheme();
  if (lastResult) drawChart(lastResult);   /* SVG 颜色是烘进去的，换主题要重画 */
}

/* 从基准货币换算到展示货币 */
function conv(v){
  if (v === null || v === undefined || !isFinite(v)) return v;
  return v * rateOf(state.displayCur) / rateOf(engineBase());
}

function moneyEur(v, dec){ return fmtMoney(v, dec === undefined ? 0 : dec, state.lang, "EUR"); }

  var d = conv(v), a = Math.abs(d), sign = d < 0 ? "-" : "";

  var f = FMT[state.lang];
  if (a >= 1e6) return sign + s + fmtNum(a / 1e6, a >= 1e7 ? 0 : 1, state.lang) + "M";
  if (a >= 1e3) return sign + s + fmtNum(Math.round(a / 1e3), 0, state.lang) + "k";
  return sign + s + fmtNum(Math.round(a), 0, state.lang);
}

  $("#inpFx").addEventListener("input", function(){
    var x = parseFloat(this.value);

    /* 手动改过的币种打「手动」标，之后的自动刷新不再覆盖它 */
    fxSetManual(state.displayCur, x);
    var man = $("#fxMan");
    if (man) man.hidden = false;
    var clr = $("#btnFxClear");
    if (clr) clr.hidden = false;
    schedule(true);
  });
  $("#btnFxRefresh").addEventListener("click", function(){ fxManualRefresh(); });
  $("#btnFxClear").addEventListener("click", function(){
    fxClearManual(state.displayCur);
    renderCond();
    syncAllFields(); renderComboCards(); renderFoot(); schedule(true);
  });
  $("#inpHours").addEventListener("input", function(){
    var x = parseFloat(this.value);

function hourCostText(c){
  var cell = c.labour_cost_hour_eur ? c.labour_cost_hour_eur.accommodation_food_I : null;
  var flag = cellFlag(c, "I");
  if (!cell || flag){
    var alt = c.labour_cost_hour_eur ? c.labour_cost_hour_eur.admin_support_N : null;
    if (alt && !cellFlag(c, "N")) return fmtNum(alt.value, 1, state.lang) + " <small>" + (cell?"⚠ ":"") + "N/" + alt.year + "</small>";
    return '<small>' + esc(t("cond.none")) + '</small>';
  }
  return fmtNum(cell.value, 1, state.lang) + " <small>€/h · " + cell.year + '</small>';
}

function setCountry(code){
  state.country = code;
  var c = country();
  if (c.currency && RATES[c.currency]) state.displayCur = c.currency;
  /* 用户主动切国家 → 打开「按国家口径填人工成本」 */
  state.countryAuto = true;
  applyCountryAuto();
  renderCond();
  buildInputs();
  syncAllFields();
  renderFoot();
  schedule(true);
}
function setDisplayCur(code){
  state.displayCur = code;
  renderCond();
  syncAllFields();
  renderComboCards();
  renderFoot();
  schedule(true);
}
function applyCountryAuto(){
  if (!state.countryAuto) return;
  var kind = ENGINES[state.mode].suggest;
  var val = kind ? suggestValue(kind) : null;
  if (val === null) return;
  if (state.mode === "combo"){
    state.combo.monthlyLabourCost = Math.round(val);
  } else if (state.mode === "clean" || state.mode === "hotel"){
    state.v.salary = Math.round(val);
    state.auto[state.mode]["salary"] = false;
  }
}

var bind = [];
function buildInputs(){
  var host = $("#colIn");
  var html = "";
  if (state.mode === "combo"){
    html += buildComboPanel();
  } else {
    var eng = ENGINES[state.mode];
    eng.groups.forEach(function(gr){ html += buildGroup(gr, eng); });
  }
  html += buildSourceList();

  bindInputs();

function buildGroup(gr, eng){
  var html = '<div class="group" data-group="' + gr.no + '">';
  html += '<div class="group-head"><span class="group-no">' + gr.no + '</span>'
        + '<span class="group-title">' + esc(t(gr.t)) + '</span>';
  if (gr.note && t(gr.note)) html += '<span class="group-note">' + esc(t(gr.note)) + '</span>';
  html += '</div>';

  if (gr.costMode){
    html += '<div class="mode-row"><span class="param-name">' + esc(t("mode.label")) + srcBadge("D1") + '</span>'
          + '<div class="seg" id="costSeg" role="group"><span class="seg-thumb" id="costThumb"></span>'
          + '<button type="button" data-cmode="lease">' + esc(t("mode.lease")) + '</button>'
          + '<button type="button" data-cmode="purchase">' + esc(t("mode.purchase")) + '</button>'
          + '</div></div>';
  }
  if (gr.preset){
    var ps = PRESETS[gr.preset];
    html += '<div class="preset-row"><span class="param-name">' + esc(t(ps.key)) + '</span>'
          + '<div class="seg" id="' + ps.dom + '" role="group"><span class="seg-thumb" id="' + ps.thumb + '"></span>';
    Object.keys(ps.items).forEach(function(k){
      html += '<button type="button" data-preset="' + k + '" title="' + esc(t(ps.items[k].full)) + '">'
            + esc(t(ps.items[k].label)) + '</button>';
    });
    html += '</div>';
    if (gr.preset === "catering"){
      html += '<span class="auto-note" id="presetHint"></span>';
    }
    html += '</div>';
  }
  gr.params.forEach(function(p){ html += buildParam(p); });
  html += '</div>';

function buildParam(p){
  var html = '<div class="param" data-key="' + p.k + '"'
       + (p.only ? ' data-only="' + p.only + '"' : '') + '>';
  html += '<div class="param-head"><label class="param-name" for="num-' + p.k + '">' + esc(t(p.n))
        + srcBadge(p.src) + (p.assumed ? assumeBadge() : '') + '</label>'
        + '<span class="field"><span class="field-cur" data-sym></span>'
        + '<input type="number" id="num-' + p.k + '" class="num" inputmode="decimal">'
        + '<span class="field-unit">' + esc(p.u ? t(p.u) : "") + '</span></span></div>';
  if (p.auto){
    html += '<div class="auto-row"><div class="seg seg-xs" data-auto="' + p.k + '" role="group">'
          + '<span class="seg-thumb"></span>'
          + '<button type="button" data-auto-val="1">' + esc(t("auto.auto")) + '</button>'
          + '<button type="button" data-auto-val="0">' + esc(t("auto.manual")) + '</button>'
          + '</div><span class="auto-note" id="autoNote-' + p.k + '"></span></div>';
  }
  html += '<input type="range" class="param-range" id="rng-' + p.k + '" aria-label="' + esc(t(p.n)) + '">';
  html += '<div class="scale"><span data-min></span><span data-max></span></div>';
  if (p.derived) html += '<div class="derived" id="' + p.derived + '"></div>';
  if (p.suggest) html += '<div class="suggest" id="suggest-' + p.k + '"></div>';
  html += '</div>';
  return html;
}
function bindInputs(){
  bind = [];
  $$("#colIn .param[data-key]").forEach(function(wrap){
    var k = wrap.dataset.key;
    var p = findParam(k);
    if (!p) return;
    var rec = {p:p, wrap:wrap, range:wrap.querySelector("input[type=range]"),
               number:wrap.querySelector("input[type=number]"),
               sym:wrap.querySelector("[data-sym]")};
    bind.push(rec);
    rec.range.addEventListener("input", function(){
      setAuto(k, false); state.v[k] = clamp(+rec.range.value, p);
      syncAutoToggles(); syncField(rec); syncDerived(); schedule();
    });
    rec.number.addEventListener("input", function(){
      var raw = parseFloat(rec.number.value);
      if (!isFinite(raw)) return;
      setAuto(k, false);
      state.v[k] = clamp(p.money ? raw / fxNow() : raw, p);
      rec.range.value = state.v[k];
      syncAutoToggles(); syncDerived(); renderFoot(); schedule();
    });
    rec.number.addEventListener("blur", function(){ syncField(rec, true); });
    rec.number.addEventListener("keydown", function(e){ if (e.key === "Enter") rec.number.blur(); });
    if (p.auto){
      wrap.querySelectorAll("[data-auto-val]").forEach(function(b){
        b.addEventListener("click", function(){
          setAuto(k, b.dataset.autoVal === "1");

          syncAutoToggles(); syncField(rec); syncDerived(); renderFoot(); schedule(true);
        });
      });

  });

  });

  var ps = null;
  eng.groups.forEach(function(g){ if (g.preset) ps = PRESETS[g.preset]; });
  if (ps) $$("#" + ps.dom + " button").forEach(function(b){
    b.addEventListener("click", function(){ setPreset(b.dataset.preset); });
  });
  $$("#colIn [data-pain]").forEach(function(el){

      renderComboCards(); renderFoot(); schedule(true);
    });

  /* 窄道/老楼：把餐饮场景的 T10 换成窄道版 T11 */

  if (nr) nr.addEventListener("change", function(){
    state.combo.narrow = this.checked;
    renderComboCards(); schedule(true);
  });
  /* 医疗新品「纳入测算（演示用）」的勾选框长在右栏结果区（见 renderComboCards），

  if (sc) sc.addEventListener("change", function(){
    state.combo.scen = this.value;

    buildInputs(); renderComboCards(); schedule(true);
  });
  var ca = $("#selCat");
  if (ca) ca.addEventListener("change", function(){
    state.combo.cat = this.value;
    var first = COMBO_DATA.scenarios.filter(function(s){ return s.cat === state.combo.cat; })[0];
    if (first) state.combo.scen = first.id;
    buildInputs(); renderComboCards(); schedule(true);
  });
  $$("#colIn [data-scale]").forEach(function(inp){
    inp.addEventListener("input", function(){
      var x = parseFloat(this.value);
      state.combo.scale[this.dataset.scale] = isFinite(x) ? x : 0;
      renderComboCards(); schedule(true);
    });
  });
  $$("#colIn [data-apply]").forEach(function(b){
    b.addEventListener("click", function(){
      var s = suggestValue(b.dataset.apply);
      if (s === null) return;

function findParam(k){
  var eng = ENGINES[state.mode];
  for (var i = 0; i < eng.groups.length; i++)
    for (var j = 0; j < eng.groups[i].params.length; j++)
      if (eng.groups[i].params[j].k === k) return eng.groups[i].params[j];
  return null;
}
function autoOn(k){ return !!(state.auto[state.mode] && state.auto[state.mode][k]); }
function setAuto(k, on){
  if (!state.auto[state.mode]) state.auto[state.mode] = {};
  state.auto[state.mode][k] = on;
  if (on && state.countryAuto) { /* 自动档即用公式，无需再覆盖 */ }
}
function fxNow(){ return rateOf(state.displayCur) / rateOf(engineBase()); }
function clamp(x, p){ return !isFinite(x) ? p.min : Math.min(p.max, Math.max(p.min, x)); }

function syncAllFields(){
  bind.forEach(function(r){ syncField(r); });
  syncAutoToggles(); syncDerived(); syncCostMode(); syncPresetSeg(); syncSuggestRows();
}
function syncField(rec, useState){
  var p = rec.p, v = state.v[p.k], f = fxNow();
  rec.sym.textContent = p.money ? curSym(state.displayCur) : "";
  rec.sym.style.display = p.money ? "" : "none";
  rec.range.min   = p.money ? Math.round(p.min * f) : p.min;
  rec.range.max   = p.money ? Math.round(p.max * f) : p.max;
  rec.range.step  = p.money ? (p.step * f) : p.step;
  rec.range.value = p.money ? v * f : v;
  rec.wrap.querySelector("[data-min]").textContent = bound(p.min, p);
  rec.wrap.querySelector("[data-max]").textContent = bound(p.max, p);
  var locked = !!(p.auto && autoOn(p.k));
  rec.range.disabled = locked; rec.number.disabled = locked;
  rec.wrap.classList.toggle("is-auto", locked);
  if (useState !== false) rec.number.value = p.money ? Math.round(v * f) : v.toFixed(p.dec);
}
function bound(x, p){ return p.money ? curSym(state.displayCur) + fmtNum(x * fxNow(), 0, state.lang) : fmtNum(x, p.dec, state.lang); }
function syncCostMode(){
  $$("#costSeg button").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset.cmode === state.costMode));
  });
  placeThumb("#costSeg", "#costThumb");
  $$("#colIn .param[data-only]").forEach(function(el){
    el.classList.toggle("hidden", el.dataset.only !== state.costMode);
  });
}
function syncAutoToggles(){
  $$("#colIn [data-auto]").forEach(function(seg){
    var k = seg.dataset.auto;
    seg.querySelectorAll("button").forEach(function(b){
      b.setAttribute("aria-pressed", String((b.dataset.autoVal === "1") === autoOn(k)));
    });
    placeThumbIn(seg);
  });

function syncPresetSeg(){
  var eng = ENGINES[state.mode];
  var ps = null;
  eng.groups.forEach(function(g){ if (g.preset) ps = PRESETS[g.preset]; });
  if (!ps) return;
  var seg = $("#" + ps.dom);
  if (!seg) return;
  var cur = state.preset[eng.id];
  seg.querySelectorAll("button").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset.preset === cur));
  });
  placeThumb("#" + ps.dom, "#" + ps.thumb);

function syncSuggestRows(){
  $$("#colIn .suggest").forEach(function(el){
    var wrap = el.closest(".param");
    var k = wrap ? wrap.dataset.key : null;
    if (!k) return;
    var p = findParam(k);
    if (!p || !p.suggest) { el.hidden = true; return; }
    var r = labourEstimate(p.suggest);
    if (r.value === null){
      el.hidden = false;
      el.innerHTML = '<span>⚠ ' + esc(t("cond.noWageData")) + '</span>';
      return;
    }
    el.hidden = false;
    var why = r.basis === "industry"
      ? t("cond.suggestIndustry", {nace: t("cond.industry" + r.nace), hour: fmtNum(r.hourCost,1,state.lang), year: r.year, hours: fmtNum(state.monthHours,1,state.lang)})
      : t("cond.suggestWage", {med: moneyEur(medianWageOf(country())), social: fmtNum(r.socialRate*100,1,state.lang), factor: fmtNum(state.jobFactor,2,state.lang)});
    el.innerHTML = '<span>' + esc(countryName(state.country, state.lang)) + '：<b>' + moneyEur(r.value)
      + '</b> <small>' + esc(why) + '</small></span>'
      + '<button type="button" class="btn-apply" data-apply="' + p.suggest + '" data-key="' + k + '">'
      + esc(t("cond.applyCountry")) + '</button>';
    el.querySelector("[data-apply]").addEventListener("click", function(){
      state.v[k] = Math.round(r.value);
      setAuto(k, false);
      syncAllFields(); renderFoot(); schedule(true);
    });
  });
}
function syncDerived(){

    el = $("#dvRent");

      + '<span class="fx-note">' + c.nPlan + ' × ' + money(v.rent) + '</span></span>';
  }
  bind.forEach(function(rec){
    if (!rec.p.auto) return;
    var note = document.getElementById("autoNote-" + rec.p.k);
    if (note) note.textContent = autoOn(rec.p.k) ? t("auto.auto") + " → " + fmtNum(v[rec.p.k], rec.p.dec, state.lang) : t("auto.manualNote");
  });
}
function setPreset(key){
  var eng = ENGINES[state.mode];
  var ps = null;
  eng.groups.forEach(function(g){ if (g.preset) ps = PRESETS[g.preset]; });
  if (!ps || !ps.items[key]) return;
  state.preset[eng.id] = key;
  var ap = ps.items[key].apply;
  Object.keys(ap).forEach(function(k){ state.v[k] = ap[k]; });
  if (eng.id === "clean"){ autoSet("heads", true); autoSet("n", true); }
  resolveAuto();
  syncPresetSeg(); syncAllFields(); renderFoot(); schedule(true);
}
function autoSet(k, on){ if (!state.auto[state.mode]) state.auto[state.mode] = {}; state.auto[state.mode][k] = on; }
function resolveAuto(){
  var eng = ENGINES[state.mode];
  eng.groups.forEach(function(gr){
    gr.params.forEach(function(p){
      if (p.auto && autoOn(p.k)) state.v[p.k] = p.auto.fn(state.v);
    });
  });
}

function ruleBasis(id, lang){ var r = RULE_BASIS[id]; return r ? (r[lang] || r.en) : ""; }

function hintKeys(id){
  var out = SCALE_ORDER.filter(function(k){
    return (DRIVER_MODELS[k] || []).indexOf(id) >= 0;
  });
  return out;
}
function findScenario(id){
  for (var i = 0; i < COMBO_DATA.scenarios.length; i++)
    if (COMBO_DATA.scenarios[i].id === id) return COMBO_DATA.scenarios[i];
  return COMBO_DATA.scenarios[0];
}
function comboScenario(){ return findScenario(state.combo.scen); }
function comboScaleKeys(sc){
  var set = {};
  (sc.inputs || []).forEach(function(k){ set[k] = true; });
  (sc.combo || []).forEach(function(id){ hintKeys(id).forEach(function(k){ set[k] = true; }); });
  return SCALE_ORDER.filter(function(k){ return set[k]; });
}
function comboPlan(extraOpts){
  var sc = comboScenario();
  var opts = Object.assign({
    pains: Object.keys(state.combo.pain).filter(function(k){ return state.combo.pain[k]; }),
    labourRate: state.v.lrate || 125,
    shiftHours: state.v.hours || 8,
    occ: HOTEL_DEFAULTS.occ, pax: HOTEL_DEFAULTS.pax,
    demandRate: HOTEL_DEFAULTS.dDrink + HOTEL_DEFAULTS.dFood + HOTEL_DEFAULTS.dItem + HOTEL_DEFAULTS.dOther,
    tHuman: 52 / HOTEL_DEFAULTS.vHuman / 60 + HOTEL_DEFAULTS.tripFloors * HOTEL_DEFAULTS.liftWait * 2 + HOTEL_DEFAULTS.talk,
    vSpeed: CATERING_DEFAULTS.vSpeed, humanSpeed: HOTEL_DEFAULTS.vHuman, tripDist: CATERING_DEFAULTS.tripDist,
    narrow: state.combo.narrow === true,
    includeUpcoming: state.combo.includeUpcoming === true
  }, extraOpts || {});
  return planCombo(state.combo.scale, sc, COMBO_DATA, opts);
}
function comboResult(){
  var plan = comboPlan();
  return computeCombo(plan, {
    baseRent: state.v.baseRent, maintR: state.v.maintR, leaseM: state.v.leaseM,
    monthlyLabourCost: state.v.monthlyLabourCost,
    factor: MODEL_FACTOR, powerPer: MODEL_POWER,
    mode: state.costMode, growth: state.v.growth, rate: state.v.rate
  });
}

    return fmtNum(eq.tripsPerMachine,1,L) + " × " + fmtNum(eq.tHuman,2,L) + " min ÷ 60 ÷ " + fmtNum(eq.terms.shift,1,L) + " h = "
         + fmtNum(eq.eq,2,L);

    return fmtNum(eq.Z,1,L) + "/h × " + fmtNum(eq.humanMin,2,L) + " min ÷ 60 = " + fmtNum(eq.eq,2,L);
  }
  return fmtNum(eq.eq,2,L);

/* —— 医疗新品（出海准备中）——
   单独一区：明确「即将推出 / 暂不计入 ROI 计算」。默认只列候选、不给台数；
   勾「纳入测算（演示用）」才按页面假设的台数进组合，卡上照旧标琥珀色假设徽章。 */
function upcomingSection(plan, split){
  if (!plan.upcomingIds.length) return "";
  var inPlan = {};
  plan.items.forEach(function(it){ if (isUpcoming(it.id)) inPlan[it.id] = it.count; });
  var html = '<div class="up-card" id="upCard">'
    + '<div class="up-head"><h3>' + esc(t("up.heading")) + '</h3>'
    + '<span class="up-badge">' + esc(t("up.badge")) + '</span>'
    + '<span class="up-badge no-roi">' + esc(t("up.noRoi")) + '</span></div>'
    + '<p class="up-policy">' + esc(t("up.policy")) + '</p>'
    + '<div class="up-grid">';
  plan.upcomingIds.forEach(function(id){
    var rule = SIZING[id] || {};
    var count = inPlan[id];
    html += '<div class="up-item" data-up="' + esc(id) + '"'
      + ' data-up-included="' + (count ? "1" : "0") + '">'
      + '<div class="up-item-top"><span class="up-item-id">' + esc(prodShort(id)) + '</span>'
      + '<span class="up-item-count">'
      + (count ? '<b>' + fmtNum(count,0,state.lang) + '</b> ' + esc(t("u.unit"))
               : '<b>—</b> ' + esc(t("up.noRoi")))
      + '</span></div>'
      + '<div class="up-item-name">' + esc(prodName(id)) + '</div>'
      + '<div class="up-item-role">' + esc(prodRole(id)) + '</div>'
      + '<div class="up-item-foot">'
      + esc(t("up.basis", {ref: rule.assumes || "—"}))
      + (count ? ' · ' + esc(t("up.inPlan")) : '')
      + '</div></div>';
  });
  html += '</div>'
    + '<div class="paingrid up-toggle">'
    + '<label class="painbox"><input type="checkbox" id="chkUpcoming"'
    + (plan.includeUpcoming ? " checked" : "") + '>'
    + '<span>' + esc(t("up.include")) + '<br><span class="pb-note">' + esc(t("up.includeNote")) + '</span></span></label>'
    + '</div></div>';
  return html;
}

function renderComboCards(){
  var host = $("#outExtra");
  if (!host) return;
  if (state.mode !== "combo"){ host.innerHTML = ""; return; }

  var sc = comboScenario();

  var split = splitExcluded(plan);
  var pains = Object.keys(state.combo.pain).filter(function(k){ return state.combo.pain[k]; });

    .map(function(k){ return esc(t("p." + k)) + " " + fmtNum(state.combo.scale[k], 0, state.lang); }).join(" · ");
  /* 台数只数机器人：配件与「即将推出」的新品都不进来 */

    + '<div class="combo-head-top"><h2>' + esc(t("combo.heading")) + '</h2>'
    + '<span class="combo-chip">' + esc(catName(sc.cat)) + '</span>'
    + '<span class="combo-chip">' + esc(scenName(sc)) + '</span>'

    + '</div>';
  if (scaleTxt) html += '<p class="combo-sum">' + esc(t("combo.scale")) + '：' + scaleTxt + '</p>';
  if (plan.items.length) html += '<p class="combo-sum">' + esc(t("combo.totalUnits", {n: fmtNum(totalUnits,0,state.lang), k: fmtNum(plan.items.length,0,state.lang)})) + '</p>';

  if (!plan.items.length && !plan.excluded.length){
    html += '<div class="combo-empty">' + esc(t("combo.noMachines")) + '</div>'
      + upcomingSection(plan, split) + accessorySection(split) + '</div>';
    host.innerHTML = html;
    return;
  }

  html += '<div class="combo-grid">';
  plan.items.forEach(function(it){
    /* 「从痛点追加」「窄道换成 T11」「医疗新品纳入测算」这三件事都要在卡上说清，
       否则用户看不出这一台为什么在、为什么换了型号。 */
    var fromNarrow = Object.keys(plan.swapped).some(function(k){ return plan.swapped[k] === it.id; });
    html += '<div class="mcard">'
      + '<div class="mcard-top"><span class="mcard-id">' + esc(prodShort(it.id)) + '</span>'
      + '<span class="mcard-count"><b>' + fmtNum(it.count,0,state.lang) + '</b><i>' + esc(t("u.unit")) + '</i></span></div>'
      + '<div class="mcard-name">' + esc(prodName(it.id)) + '</div>'
      + '<div class="mcard-role">' + esc(prodRole(it.id)) + '</div>'
      + '<div class="mcard-foot">'
      + '<span class="mcard-eq">' + esc(t("combo.eq")) + ' ' + fmtNum(it.eqInfo.eq,2,state.lang) + ' ' + esc(t("u.person")) + '</span>'
      + (it.eqInfo.assumed ? assumeBadge() : '')
      + (it.fromPain ? '<span class="mcard-why">' + esc(t("combo.fromPain")) + '</span>' : '')
      + (fromNarrow ? '<span class="mcard-why">' + esc(t("combo.narrowApplied")) + '</span>' : '')
      + '</div>'
      + '<div class="mcard-rule">' + esc(ruleBasis(it.id, state.lang)) + ' | ' + esc(eqFormulaText(it.eqInfo)) + '</div>'
      + '</div>';
  });
  html += '</div>';

  html += upcomingSection(plan, split);

  if (split.excluded.length){
    html += '<div class="combo-grid" style="margin-top:8px">';
    split.excluded.forEach(function(ex){
      var why = "";
      if (ex.why === "seat") why = t("combo.needSeat");
      else if (ex.why === "no_rule") why = t("combo.noRule");
      else if (ex.why === "not_mainline") why = t("combo.whynotmainline");
      else if (ex.why === "upcoming") why = t("combo.whyupcoming");
      else if (ex.why && ex.why.indexOf("missing:") === 0){
        var f = ex.why.split(":")[1];
        why = t("combo.needField", {field: t("p." + f)});
      }
      html += '<div class="mcard mcard-excluded">'
        + '<div class="mcard-top"><span class="mcard-id">' + esc(prodShort(ex.id)) + '</span>'
        + '<span class="mcard-count"><b>—</b><i>' + esc(t("combo.excluded")) + '</i></span></div>'
        + '<div class="mcard-name">' + esc(prodName(ex.id)) + '</div>'
        + '<div class="mcard-foot"><span class="mcard-why">' + esc(why) + '</span></div>'
        + '<div class="mcard-rule">' + esc(ruleBasis(ex.id, state.lang)) + '</div>'
        + '</div>';
    });
    html += '</div>';
  }

  html += accessorySection(split);

  html += '<div class="combo-actions">'
    + '<button type="button" class="btn-primary" id="btnApplyCombo"' + (plan.items.length ? "" : " disabled") + '>'
    + esc(t("combo.apply")) + '</button>'
    + (state.combo.applied ? '<span class="combo-chip">' + esc(t("combo.applied")) + '</span>' : '')
    + '<span class="combo-chip">' + esc(t("combo.curBasis", {cur: curName(state.displayCur)})) + '</span>'
    + '</div></div>';
  host.innerHTML = html;

  var ap = $("#btnApplyCombo");
  if (ap) ap.addEventListener("click", function(){
    state.combo.applied = true;
    renderComboCards(); schedule(true);
  });
  var ui = $("#chkUpcoming");
  if (ui) ui.addEventListener("change", function(){
    state.combo.includeUpcoming = this.checked;
    /* 之前按过「带入计算」的话，勾选变化要顺手把 ROI 一起刷新 */
    if (state.combo.applied) schedule(true);
    renderComboCards();
  });
}

    el.dataset.ready = "1";
  });

  if (!on){ $("#heroSub").textContent = t("combo.notApplied"); return; }
  var head;
  if (state.mode === "combo"){
    head = t("hero.sub.combo", {
      n: fmtNum(r.units,0,state.lang), eq: fmtNum(r.eqTotal,2,state.lang),
      save: money(r.monthlySaved), cost: money(r.monthlyCost), net: money(r.monthlyNet)});

    head = r.monthlyNet > 0

      : t("hero.sub.cleanNeg", {n: fmtNum(r.machines,0,state.lang), v: money(Math.abs(r.monthlyNet))});
    if (r.monthlyNet > 0){
      if (r.I0 === 0) head += " " + t("hero.sub.lease");
      else if (r.payback === 0) head += " " + t("hero.sub.firstMonth");
      else if (r.payback === null || r.payback > HORIZON) head += " " + t("hero.sub.never");
      else head += " " + t("hero.sub.payback", {v: money(r.I0), m: fmtNum(r.payback,1,state.lang)});
    }
  } else if (state.mode === "hotel"){
    head = t("hero.sub.hotel", {t: fmtNum(r.trips,1,state.lang), h: fmtNum(r.nHuman,0,state.lang),
                                n: fmtNum(r.nRobot,0,state.lang), v: money(r.monthlyNet)});
  } else {
    head = t("hero.sub.cater", {p: fmtNum(state.v.peakDemand,0,state.lang), n: fmtNum(r.nNeed,0,state.lang),
                                k: fmtNum(r.nPlan,0,state.lang), r: fmtNum(state.v.replace,0,state.lang),
                                v: money(r.save)});

function rollDigit(el){
  el.style.transition = "none"; el.style.transform = "translateY(.2em)"; el.style.opacity = ".3";
  requestAnimationFrame(function(){ el.style.transition = ""; el.style.transform = ""; el.style.opacity = ""; });
}
function benchRow(name, cur, off, kind){
  var tol = kind === "dec1" ? 0.05 : 5e-3;
  var diff = cur - off, ok = Math.abs(diff) <= tol;
  var fmt = kind === "int"  ? function(x){ return fmtNum(x,0,state.lang); }
          : kind === "sec"  ? function(x){ return fmtNum(x,0,state.lang) + " s"; }
          : kind === "dec1" ? function(x){ return fmtNum(x,1,state.lang); }
          : function(x){ return fmtMoney(x, 2, state.lang, ENGINES[state.mode].base); };
  return {name:name, ok:ok, cur:fmt(cur), off:fmt(off),
          delta: ok ? t("bench.ok") : (diff > 0 ? "+" : "−") + fmt(Math.abs(diff)).replace(/^[^\d-]*/, "")};
}
function renderBench(r){

  card.hidden = false;

  if (spec === "hotel"){

    rows = [
      benchRow(t("bench.humanTotal"), r.humanTotal, 5758.92381),
      benchRow(t("bench.robotTotal"), r.robotAccrual, 2620.833333),
      benchRow(t("bench.monthSave"), r.monthlyNet, 3138.090476),
      benchRow(t("bench.yearSave"), r.monthlyNet * 12, 37657.085714)
    ];
    footOk = t("bench.okHotel"); footOff = t("bench.offHotel");
  } else {
    var serve = state.preset.catering === "serve";
    src = serve ? t("bench.caterServeSrc") : t("bench.caterBusserSrc");
    rows = [
      benchRow(t("bench.Y"), r.Y, serve ? 130 : 190, "sec"),
      benchRow(t("bench.Z"), r.Z, serve ? 27.7 : 18.9, "dec1"),
      benchRow(t("bench.nNeed"), r.nNeed, serve ? 2 : 1, "int"),
      benchRow(t("bench.laborYear"), r.humanTotal, 134160),
      benchRow(t("bench.collabYear"), r.robotAccrual, 95640),
      benchRow(t("bench.saveYear"), r.save, 38520)
    ];
    footOk = t("bench.okCater"); footOff = t("bench.offCater"); minor = t("bench.minorCater");
  }
  var html = '<span class="bh">' + esc(t("bench.colName")) + '</span>'
    + '<span class="bh" style="text-align:right">' + esc(t("bench.colCur")) + '</span>'
    + '<span class="bh" style="text-align:right">' + esc(t("bench.colOff")) + '</span>'
    + '<span class="bh" style="text-align:right">' + esc(t("bench.colDev")) + '</span>';
  var allOk = true;
  rows.forEach(function(row){
    if (!row.ok) allOk = false;
    html += '<span class="bl">' + esc(row.name) + '</span>'
          + '<span class="bv">' + esc(row.cur) + '</span>'
          + '<span class="bv bo">' + esc(row.off) + '</span>'
          + '<span class="bflag ' + (row.ok ? "bench-ok" : "bench-off") + '">' + esc(row.delta) + '</span>';

}

function roiFormulaHtml(){
  var s = t("foot.roiNote");

  if (cut <= 0) return '<p class="formula"><span class="formula-eq">' + esc(s) + '</span></p>';
  return '<p class="formula"><span class="formula-eq">' + esc(s.slice(0, cut).trim()) + '</span>'
       + '<span class="formula-note">' + esc(s.slice(cut)) + '</span></p>';
}

function renderRuler(r){
  var card = $("#rulerCard");
  var show = (state.mode !== "combo") || state.combo.applied;
  card.hidden = !show;
  if (!show) return;
  var laborLabel, costLabel, segs;
  if (state.mode === "catering"){
    laborLabel = t("ruler.laborCater"); costLabel = t("ruler.costCater");
    segs = [{k:"labor", name:t("seg.labor"), c:"var(--seg-cap)"},
            {k:"rent",  name:t("seg.rent"),  c:"var(--seg-equip)"}];
  } else if (state.mode === "hotel"){
    laborLabel = t("ruler.laborHotel"); costLabel = t("ruler.costHotel");
    segs = [{k:"equip", name:t("seg.rent"), c:"var(--seg-equip)"},
            {k:"maint", name:t("seg.maintDeploy"), c:"var(--seg-maint)"}];
  } else if (state.mode === "combo"){
    laborLabel = t("ruler.laborCombo"); costLabel = t("ruler.costCombo");
    segs = [{k:"equip", name:t("seg.rent"), c:"var(--seg-equip)"},
            {k:"maint", name:t("seg.maint"), c:"var(--seg-maint)"},
            {k:"power", name:t("seg.power"), c:"var(--seg-power)"}];
  } else {
    laborLabel = t("ruler.laborClean"); costLabel = t("ruler.costClean");
    segs = [{k:"equip", name: state.costMode === "lease" ? t("seg.rent") : t("seg.dep"), c:"var(--seg-equip)"},
            {k:"resid", name:t("seg.resid"), c:"var(--seg-cap)"},
            {k:"maint", name:t("seg.maint"), c:"var(--seg-maint)"},
            {k:"power", name:t("seg.power"), c:"var(--seg-power)"}];
  }
  var total = 0;
  segs.forEach(function(s){ total += r.seg[s.k] || 0; });
  var scale = Math.max(r.humanTotal, total, 1);
  var host = $("#rulerRows");
  var sig = state.lang + "|" + state.mode + "|" + state.costMode + "|" + segs.map(function(s){ return s.k; }).join(",");
  if (host.dataset.sig !== sig){ host.dataset.sig = sig; host.innerHTML = rulerSkeleton(laborLabel, costLabel, segs); }
  $("#barLabor").style.width = (r.humanTotal / scale * 100) + "%";
  $("#valLabor").textContent = money(r.humanTotal);
  var cost = $("#barCost");
  cost.style.width = (total / scale * 100) + "%";
  segs.forEach(function(s){
    var el = cost.querySelector('.s[data-k="' + s.k + '"]');
    var val = r.seg[s.k] || 0;
    el.style.width = total > 0 ? (val / total * 100) + "%" : "0%";
    el.style.background = s.c;
    el.style.display = val > 0 ? "" : "none";
  });
  $("#valCost").textContent = money(total);
  var lo = Math.min(r.humanTotal, total) / scale * 100;
  var hi = Math.max(r.humanTotal, total) / scale * 100;
  var d = $("#deltaBar");
  d.style.left = lo + "%";
  d.style.width = Math.max(0, hi - lo) + "%";
  var diff = r.humanTotal - total;
  d.classList.toggle("neg", diff < 0);
  var cap = $("#deltaCap");
  cap.textContent = money(diff) + (r.humanTotal > 0 ? "（" + pct(diff / r.humanTotal * 100) + "）" : "");
  cap.classList.toggle("neg", diff < 0);
  var lhtml = "";
  segs.forEach(function(s){
    var val = r.seg[s.k] || 0;
    if (val <= 0) return;
    lhtml += '<li><span class="sw" style="background:' + s.c + '"></span>' + esc(s.name)
          + ' <b>' + money(val) + '</b> <u>' + (total > 0 ? fmtNum(val / total * 100, 0, state.lang) : "0") + '%</u></li>';
  });
  $("#rulerLegend").innerHTML = lhtml;
  $("#rulerTitle").textContent =
      state.mode === "combo" ? t("ruler.comboTitle")
    : state.mode === "catering" ? t("ruler.caterTitle")
    : state.mode === "hotel" ? t("ruler.hotelTitle") : t("ruler.cleanTitle");
  $("#rulerNote").textContent =
      state.mode === "combo" ? t("ruler.noteCombo")
    : state.mode === "catering" ? t("ruler.noteCater")
    : state.mode === "hotel" ? t("ruler.noteHotel") : t("ruler.noteSame");
}
function rulerSkeleton(laborLabel, costLabel, segs){
  var bars = "";
  segs.forEach(function(s){ bars += '<span class="s" data-k="' + s.k + '"></span>'; });
  return '<div class="rrow"><div class="rlabel">' + laborLabel + '</div>'
    + '<div class="rtrack"><div class="rbar rbar-labor" id="barLabor"></div></div>'
    + '<div class="rval num" id="valLabor"></div></div>'
    + '<div class="rrow"><div class="rlabel">' + costLabel + '</div>'
    + '<div class="rtrack"><div class="rbar" id="barCost">' + bars + '</div></div>'
    + '<div class="rval num" id="valCost"></div></div>'
    + '<div class="ruler-delta"><div class="rlabel" style="font-size:12.5px">' + esc(t("ruler.netSave")) + '</div>'
    + '<div class="delta-track"><div class="delta-bar" id="deltaBar"></div></div>'
    + '<div class="delta-cap num" id="deltaCap"></div></div>';
}

/* ---------------- SVG 曲线 ---------------- */
var chartGeo = null;

/* 图表配色一律从当前主题的 CSS token 读，不写死颜色：
   切主题后 relayout()/重绘即换色。打印时 printMode 为真，走浅色 token 表
   （@media print 里 dark 定义不匹配，但 SVG 的颜色是画的时候烘进去的，
    所以这里要显式切回浅色）。 */
var printMode = false;
var PRINT_TOK = {
  ink:"#0B3157", "ink-3":"#5A5F66", "ink-4":"#666666",
  accent:"#11579D", warn:"#E60012", panel:"#FFFFFF", "rule-strong":"#C9D0D8",
  grid:"#94A3B5", "grid-zero":"rgba(11,49,87,.30)", "grid-faint":"rgba(11,49,87,.06)",
  "on-accent":"#FFFFFF", "on-ink":"#FFFFFF"
};
function cssTok(name){
  if (printMode && PRINT_TOK[name] !== undefined) return PRINT_TOK[name];
  var v = getComputedStyle(document.documentElement).getPropertyValue("--" + name);
  v = (v || "").trim();
  return v || PRINT_TOK[name] || "#000000";
}
function chartTok(){
  return {
    ink:cssTok("ink"), ink3:cssTok("ink-3"), ink4:cssTok("ink-4"),
    accent:cssTok("accent"), warn:cssTok("warn"), panel:cssTok("panel"),
    ruleStrong:cssTok("rule-strong"), grid:cssTok("grid"),
    gridZero:cssTok("grid-zero"), gridFaint:cssTok("grid-faint"),
    onAccent:cssTok("on-accent"), onInk:cssTok("on-ink")
  };
}
function niceTicks(min, max, count){
  var span = max - min; if (span <= 0) span = Math.abs(max) || 1;
  var raw = span / count;
  var mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var norm = raw / mag;
  var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  var lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  var out = [];
  for (var x = lo; x <= hi + step * 0.5; x += step) out.push(x);
  return out;
}
function drawChart(r){
  var card = $(".chart-card");
  var show = (state.mode !== "combo") || state.combo.applied;
  card.hidden = !show;
  if (!show) return;
  var host = $("#chartWrap");
  var W = Math.max(340, Math.round(host.clientWidth));
  var H = Math.max(180, Math.round(host.clientHeight));
  if (W < 40 || H < 40) return;
  var P = {t:24, r:42, b:36, l:76};
  var iw = W - P.l - P.r, ih = H - P.t - P.b;
  if (iw <= 10 || ih <= 10) return;
  var vals = r.cum.map(conv);
  var lo = Math.min.apply(null, vals.concat([0]));
  var hi = Math.max.apply(null, vals.concat([0]));
  var ticks = niceTicks(lo, hi, 4);
  var yMin = Math.min(ticks[0], lo), yMax = Math.max(ticks[ticks.length-1], hi);
  if (yMax - yMin < 1e-6) yMax = yMin + 1;
  var X = function(m){ return P.l + (m / HORIZON) * iw; };
  var Y = function(val){ return P.t + (yMax - val) / (yMax - yMin) * ih; };
  chartGeo = {W:W, H:H, P:P, X:X, Y:Y, cum:vals};
  var svg = [];
  svg.push('<defs>');
  svg.push('<clipPath id="clAbove"><rect x="' + P.l + '" y="' + P.t + '" width="' + iw + '" height="' + Math.max(0, Y(0) - P.t) + '"/></clipPath>');
  svg.push('<clipPath id="clBelow"><rect x="' + P.l + '" y="' + Y(0) + '" width="' + iw + '" height="' + Math.max(0, P.t + ih - Y(0)) + '"/></clipPath>');
  svg.push('</defs>');
  var K = chartTok();
  ticks.forEach(function(tk){
    if (tk < yMin - 1e-6 || tk > yMax + 1e-6) return;
    var y = Y(tk);
    svg.push('<line x1="' + P.l + '" y1="' + y.toFixed(1) + '" x2="' + (P.l+iw) + '" y2="' + y.toFixed(1)
      + '" stroke="' + (tk === 0 ? K.gridZero : K.grid) + '" stroke-width="1"'
      + (tk === 0 ? ' stroke-dasharray="3 3"' : '') + '/>');
    svg.push('<text x="' + (P.l - 9) + '" y="' + (y + 3.6).toFixed(1)
      + '" text-anchor="end" font-size="10.5" fill="' + K.ink4 + '" font-variant-numeric="tabular-nums">'
      + moneyShortAbs(tk) + '</text>');
  });
  for (var m = 0; m <= HORIZON; m += 6){
    var x = X(m);
    svg.push('<line x1="' + x.toFixed(1) + '" y1="' + P.t + '" x2="' + x.toFixed(1) + '" y2="' + (P.t+ih)
      + '" stroke="' + K.gridFaint + '" stroke-width="1"/>');
  }
  var line = "";
  for (var i = 0; i <= HORIZON; i++) line += (i === 0 ? "M" : "L") + X(i).toFixed(2) + " " + Y(vals[i]).toFixed(2) + " ";
  var area = line + "L" + X(HORIZON).toFixed(2) + " " + Y(0).toFixed(2) + " L" + X(0).toFixed(2) + " " + Y(0).toFixed(2) + " Z";
  svg.push('<path d="' + area + '" fill="' + K.accent + '" fill-opacity="0.15" clip-path="url(#clAbove)"/>');
  svg.push('<path d="' + area + '" fill="' + K.warn + '" fill-opacity="0.13" clip-path="url(#clBelow)"/>');
  svg.push('<path d="' + line + '" fill="none" stroke="' + K.accent + '" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>');
  var ax = P.t + ih;
  svg.push('<line x1="' + P.l + '" y1="' + ax + '" x2="' + (P.l + iw) + '" y2="' + ax + '" stroke="' + K.ruleStrong + '" stroke-width="1"/>');
  for (var t2 = 0; t2 <= HORIZON; t2 += 6){
    var tx = X(t2);
    svg.push('<line x1="' + tx.toFixed(1) + '" y1="' + ax + '" x2="' + tx.toFixed(1) + '" y2="' + (ax + 5)
      + '" stroke="' + K.grid + '" stroke-width="1"/>');
    svg.push('<text x="' + tx.toFixed(1) + '" y="' + (ax + 18) + '" text-anchor="middle" font-size="11"'
      + ' fill="' + K.ink3 + '" font-variant-numeric="tabular-nums">' + t2 + '</text>');
  }
  svg.push('<text x="' + (P.l + iw + 9) + '" y="' + (ax + 18) + '" text-anchor="start" font-size="11"'
    + ' fill="' + K.ink4 + '">' + esc(t("chart.month")) + '</text>');
  var I0d = conv(r.I0);
  if (I0d > 0){
    svg.push('<line x1="' + P.l + '" y1="' + Y(-I0d).toFixed(1) + '" x2="' + X(HORIZON).toFixed(1)
      + '" y2="' + Y(-I0d).toFixed(1) + '" stroke="' + K.ink + '" stroke-width="1" stroke-dasharray="2 3" opacity=".3"/>');
  }
  if (r.payback !== null && r.payback > 0 && r.payback <= HORIZON){
    var cx = X(r.payback), cy = Y(0);
    svg.push('<line x1="' + cx.toFixed(1) + '" y1="' + cy.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y2="' + (P.t + ih)
      + '" stroke="' + K.accent + '" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>');
    svg.push('<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5" fill="' + K.accent + '" stroke="' + K.panel + '" stroke-width="2"/>');
    var lx = Math.min(Math.max(cx, P.l + 50), P.l + iw - 50);
    svg.push('<g transform="translate(' + lx.toFixed(1) + ',' + (cy - 14).toFixed(1) + ')">'
      + '<rect x="-49" y="-13" width="98" height="19" rx="2" fill="' + K.accent + '"/>'
      + '<text x="0" y="0.5" text-anchor="middle" font-size="11" font-weight="700" fill="' + K.onAccent + '">'
      + esc(t("chart.paybackTag")) + ' ' + fmtNum(r.payback,1,state.lang) + '</text></g>');
  } else if (r.I0 === 0){
    svg.push('<g transform="translate(' + (P.l + 8) + ',' + (P.t + 12) + ')">'
      + '<rect x="0" y="-13" width="176" height="19" rx="2" fill="' + K.accent + '"/>'
      + '<text x="88" y="0.5" text-anchor="middle" font-size="11" font-weight="700" fill="' + K.onAccent + '">'

function moneyShortAbs(v){

function bindChartHover(){
  var wrap = $("#chartWrap"), tip = $("#chartTip");
  function move(e){
    if (!chartGeo) return;
    var rect = wrap.getBoundingClientRect();
    var px = (e.clientX !== undefined ? e.clientX : 0) - rect.left;
    var g = chartGeo;
    var frac = (px - g.P.l) / Math.max(1, (g.W - g.P.l - g.P.r));
    var m = Math.round(Math.min(1, Math.max(0, frac)) * HORIZON);
    var cx = g.X(m), cy = g.Y(g.cum[m]);

    if (!cross) return;
    cross.style.display = "";
    document.getElementById("crossLine").setAttribute("x1", cx);
    document.getElementById("crossLine").setAttribute("x2", cx);
    document.getElementById("crossDot").setAttribute("cx", cx);
    document.getElementById("crossDot").setAttribute("cy", cy);
    tip.classList.add("on");
    tip.style.left = cx + "px";
    tip.style.top = (cy - 12) + "px";

      + moneyShortAbs(g.cum[m]) + '</b>';

  wrap.addEventListener("pointermove", move);
  wrap.addEventListener("pointerleave", function(){
    tip.classList.remove("on");
